рской\" class=\"gv-avatar-jump\" onclick=\"showPage('dashboard');switchPanel('profile')\" title=\"Открыть профиль мастерской\" type=\"button\">\u003Cimg alt=\"Фото шейпера\" class=\"user-avatar\" src=\"img/img26.jpg\"/>\u003C/button>\u003Cdiv>\u003Cdiv class=\"profile-name\" id=\"sideName\">Иван Петров\u003C/div>\u003Cdiv class=\"profile-company\" id=\"sideCompany\">Kamchatka Boards\u003C/div>\u003Cdiv class=\"profile-rating\">\u003Cspan class=\"star\">★\u003C/span> 4.9 \u003Csmall style=\"font-weight:500;color:#6f95ac\">(26)\u003C/small>\u003C/div>\u003C/div>\u003C/div>\u003Cnav class=\"side-nav\" id=\"sideNav\">\u003Cbutton class=\"side-link active\" data-panel=\"overview\">\u003Csvg class=\"ic\">\u003Cuse href=\"#i-home\">\u003C/use>\u003C/svg>Панель управления\u003C/button>\u003Cbutton class=\"side-link\" data-panel=\"boards\">\u003Csvg class=\"ic\">\u003Cuse href=\"#i-board\">\u003C/use>\u003C/svg>Мои доски\u003C/button>\u003Cbutton class=\"side-link\" data-panel=\"requests\">\u003Csvg class=\"ic\">\u003Cuse href=\"#i-mail\">\u003C/use>\u003C/svg>Обращения \u003Csmall id=\"requestNavCount\">\u003C/small>\u003C/button>\u003Cbutton class=\"side-link\" data-panel=\"outgoing\">\u003Csvg class=\"ic\">\u003Cuse href=\"#i-send\">\u003C/use>\u003C/svg>Мои исходящие заявки \u003Csmall id=\"outgoingNavCount\">\u003C/small>\u003C/button>\u003Cbutton class=\"side-link\" data-panel=\"bookings\">\u003Csvg class=\"ic\">\u003Cuse href=\"#i-calendar\">\u003C/use>\u003C/svg>Бронирования \u003Csmall>1\u003C/small>\u003C/button>\u003Cbutton class=\"side-link\" data-panel=\"statistics\">\u003Csvg class=\"ic\">\u003Cuse href=\"#i-graph\">\u003C/use>\u003C/svg>Статистика\u003C/button>\u003Cbutton class=\"side-link\" data-panel=\"reviews\">\u003Csvg class=\"ic\">\u003Cuse href=\"#i-star\">\u003C/use>\u003C/svg>Отзывы\u003C/button>\u003Cbutton class=\"side-link\" data-panel=\"profile\">\u003Csvg class=\"ic\">\u003Cuse href=\"#i-user\">\u003C/use>\u003C/svg>Профиль\u003C/button>\u003Cbutton class=\"side-link\" data-panel=\"settings\">\u003Csvg class=\"ic\">\u003Cuse href=\"#i-settings\">\u003C/use>\u003C/svg>Настройки\u003C/button>\u003C/nav>\u003C/aside>\n\u003Cmain class=\"dash-main\">\u003Cdiv hidden=\"\" id=\"gvLegacyStatNodes\">\u003Cdiv class=\"stats-strip\">\u003Cdiv class=\"stat\">\u003Csvg class=\"ic\">\u003Cuse href=\"#i-board\">\u003C/use>\u003C/svg>\u003Cdiv>\u003Cdiv class=\"stat-number\" id=\"countBoards\">4\u003C/div>\u003Cdiv class=\"stat-desc\">Моих досок\u003C/div>\u003C/div>\u003C/div>\u003Cdiv class=\"stat\">\u003Csvg class=\"ic\">\u003Cuse href=\"#i-brief\">\u003C/use>\u003C/svg>\u003Cdiv>\u003Cdiv class=\"stat-number\" id=\"countOrders\">3\u003C/div>\u003Cdiv class=\"stat-desc\">Новые заявки\u003C/div>\u003C/div>\u003C/div>\u003Cdiv class=\"stat\">\u003Csvg class=\"ic\">\u003Cuse href=\"#i-views\">\u003C/use>\u003C/svg>\u003Cdiv>\u003Cdiv class=\"stat-number\" id=\"gvSummaryViews\">1 245\u003C/div>\u003Cdiv class=\"stat-desc\">Просмотры моделей (демо)\u003C/div>\u003C/div>\u003C/div>\u003Cdiv class=\"stat\">\u003Csvg class=\"ic\" style=\"color:#ffb600\">\u003Cuse href=\"#i-check\">\u003C/use>\u003C/svg>\u003Cdiv>\u003Cdiv class=\"stat-number\" id=\"gvSummaryFinished\">4.9\u003C/div>\u003Cdiv class=\"stat-desc\">Завершено заявок\u003C/div>\u003C/div>\u003C/div>\u003C/div>\u003Cdiv class=\"deal-stats\">\u003Cdiv class=\"stat deal-stat\">\u003Csvg class=\"ic\">\u003Cuse href=\"#i-board\">\u003C/use>\u003C/svg>\u003Cdiv>\u003Cdiv class=\"stat-number\" id=\"soldCount\">0\u003C/div>\u003Cdiv class=\"stat-desc\">Продано досок\u003C/div>\u003C/div>\u003C/div>\u003Cdiv class=\"stat deal-stat\">\u003Csvg class=\"ic\">\u003Cuse href=\"#i-calendar\">\u003C/use>\u003C/svg>\u003Cdiv>\u003Cdiv class=\"stat-number\" id=\"rentCount\">0\u003C/div>\u003Cdiv class=\"stat-desc\">Сдано в аренду\u003C/div>\u003C/div>\u003C/div>\u003Cdiv class=\"stat deal-stat\">\u003Csvg class=\"ic\">\u003Cuse href=\"#i-graph\">\u003C/use>\u003C/svg>\u003Cdiv>\u003Cdiv class=\"stat-number\" id=\"revenueCount\">0 ₽\u003C/div>\u003Cdiv class=\"stat-desc\">Выручка по завершённым сделкам\u003C/div>\u003C/div>\u003C/div>\u003C/div>\u003Cp class=\"form-help stat-footnote\">Демонстрационная статистика по заявкам, завершённым в этом браузере. Выручка — не прибыль: себестоимость и комиссия не учтены.\u003C/p>\u003C/div>\n\u003Cdiv class=\"panel-screen active\" id=\"panel-overview\">\u003Cdiv aria-label=\"Краткие показатели раздела\" class=\"gv-compact-kpis\" id=\"gvKpiOverview\">\u003C/div>\u003Cdiv class=\"lower-dash gv-overview-first\">\u003Csection class=\"card\">\u003Cdiv class=\"section-head\">\u003Ch3>\u003Csvg class=\"ic\">\u003Cuse href=\"#i-mail\">\u003C/use>\u003C/svg> Входящие заявки\u003C/h3>\u003Cbutton class=\"plain\" onclick=\"switchPanel('requests')\" type=\"button\">Все обращения →\u003C/button>\u003C/div>\u003Cdiv id=\"overviewRequests\">\u003C/div>\u003C/section>\n\u003Csection class=\"card\">\u003Cdiv class=\"section-head\">\u003Ch3>\u003Csvg class=\"ic\">\u003Cuse href=\"#i-graph\">\u003C/use>\u003C/svg> Показатели мастерской\u003C/h3>\u003Cbutton class=\"plain\" onclick=\"switchPanel('statistics')\" type=\"button\">Вся статистика →\u003C/button>\u003C/div>\u003Cdiv class=\"gv-overview-metrics\" id=\"gvOverviewMetrics\">\u003C/div>\u003C/section>\u003C/div>\n\u003Csection class=\"card gv-overview-models\">\u003Cdiv class=\"section-head\">\u003Ch3>\u003Csvg class=\"ic\">\u003Cuse href=\"#i-board\">\u003C/use>\u003C/svg> Мои модели досок\u003C/h3>\u003Cbutton class=\"primary\" onclick=\"switchPanel('boards')\" type=\"button\">Управлять моделями →\u003C/button>\u003C/div>\u003Cdiv class=\"gv-models-digest\" id=\"gvModelsDigest\">\u003C/div>\u003Cdiv hidden=\"\" id=\"overviewModels\">\u003C/div>\u003Cp class=\"form-help\">Редактирование и полный каталог ваших моделей находятся только в разделе «Мои доски».\u003C/p>\u003C/section>\n\u003Cdiv class=\"dash-promo\" style=\"margin-top:15px\">\u003Ch3>Делитесь своей философией\u003C/h3>\u003Cp>Покажите, как рождаются ваши доски.\u003Cbr/>Вдохновляйте новое поколение сёрферов.\u003C/p>\u003Cbutton class=\"outlined\" onclick=\"showPage('registration')\" type=\"button\">Редактировать профиль →\u003C/button>\u003C/div>\u003C/div>\n\u003Csection class=\"card panel-screen\" id=\"panel-boards\">\u003Cdiv class=\"section-head\">\u003Ch3>\u003Csvg class=\"ic\">\u003Cuse href=\"#i-board\">\u003C/use>\u003C/svg>Мои доски\u003C/h3>\u003Cbutton class=\"primary\" onclick=\"openBoardModal()\">\u003Csvg class=\"ic\">\u003Cuse href=\"#i-plus\">\u003C/use>\u003C/svg>Добавить доску\u003C/button>\u003C/div>\u003Cdiv class=\"tabs\" style=\"margin-bottom:15px\">\u003Cbutton class=\"tab active\" data-board-filter=\"all\">Все\u003C/button>\u003Cbutton class=\"tab\" data-board-filter=\"В наличии\">В наличии\u003C/button>\u003Cbutton class=\"tab\" data-board-filter=\"Под заказ\">Под заказ\u003C/button>\u003Cbutton class=\"tab\" data-board-filter=\"Нет в наличии\">Нет в наличии\u003C/button>\u003C/div>\u003Cdiv class=\"models\" id=\"allModels\">\u003C/div>\u003Cdiv class=\"bulk-head\">\u003Cdiv>\u003Ch3>Быстрое редактирование моделей\u003C/h3>\u003Cp class=\"form-help\">Меняйте несколько значений сразу — после сохранения изменения появятся в карточках выше.\u003C/p>\u003C/div>\u003Cbutton class=\"primary\" id=\"saveBulk\" type=\"button\">Сохранить изменения\u003C/button>\u003C/div>\u003Cdiv class=\"bulk-scroll\">\u003Ctable class=\"table bulk-table\" id=\"bulkTable\">\u003Cthead>\u003Ctr>\u003Cth>Модель\u003C/th>\u003Cth>Тип\u003C/th>\u003Cth>Длина\u003C/th>\u003Cth>Объём, л\u003C/th>\u003Cth>Цена, ₽\u003C/th>\u003Cth>Наличие\u003C/th>\u003Cth>Материал\u003C/th>\u003C/tr>\u003C/thead>\u003Ctbody id=\"bulkBody\">\u003C/tbody>\u003C/table>\u003C/div>\u003Cp class=\"form-help\" id=\"bulkHint\">Изменения применяются только после нажатия «Сохранить изменения».\u003C/p>\u003C/section>\n\u003Csection class=\"card panel-screen\" id=\"panel-requests\">\u003Cdiv aria-label=\"Краткие показатели раздела\" class=\"gv-compact-kpis\" id=\"gvKpiRequests\">\u003C/div>\u003Cdiv class=\"section-head\">\u003Cdiv>\u003Ch3>\u003Csvg class=\"ic\">\u003Cuse href=\"#i-brief\">\u003C/use>\u003C/svg> Обращения\u003C/h3>\u003Cp class=\"form-help\">Заявки и переписка в одном месте. Клиент может написать ещё до принятия заявки.\u003C/p>\u003C/div>\u003Cbutton class=\"gv-demo-incoming\" id=\"gvReceiveDemo\" title=\"Создать демонстрационное входящее сообщение\" type=\"button\">+ Тестовое сообщение\u003C/button>\u003C/div>\n\u003Cdiv aria-label=\"Раздел обращений\" class=\"gv-contact-tabs\" role=\"tablist\">\u003Cbutton aria-selected=\"true\" class=\"active\" data-gv-contact-tab=\"requests\" id=\"gvContactRequestsTab\" role=\"tab\" type=\"button\">Входящие заявки \u003Csmall id=\"gvRequestTabCount\">\u003C/small>\u003C/button>\u003Cbutton aria-selected=\"false\" data-gv-contact-tab=\"chats\" id=\"gvContactChatsTab\" role=\"tab\" type=\"button\">Чаты \u003Csmall id=\"gvChatTabCount\">\u003C/small>\u003C/button>\u003C/div>\n\u003Cdiv class=\"gv-contact-screen\" id=\"gvContactRequestsBody\">\u003Cdiv id=\"allRequests\">\u003C/div>\u003C/div>\n\u003Cdiv class=\"gv-contact-screen\" hidden=\"\" id=\"gvContactChatsBody\">\u003Cdiv class=\"gv-inbox-hint\" id=\"inboxSummary\">Все сообщения прочитаны\u003C/div>\u003Cdiv aria-live=\"polite\" id=\"gvInboxList\">\u003C/div>\u003Cp class=\"form-help\">Непрочитанные диалоги отмечаются голубым. Открытие помечает сообщения прочитанными.\u003C/p>\u003C/div>\n\u003Cspan hidden=\"\" id=\"messageNavCount\">\u003C/span>\u003C/section>\n\u003Csection class=\"card panel-screen\" id=\"panel-outgoing\">\u003Cdiv class=\"section-head\">\u003Ch3>\u003Csvg class=\"ic\">\u003Cuse href=\"#i-send\">\u003C/use>\u003C/svg> Мои исходящие заявки\u003C/h3>\u003Cspan class=\"muted\">Личная история обращений к другим шейперам\u003C/span>\u003C/div>\u003Cp class=\"form-help gv-outgoing-intro\">Здесь отображаются заявки, которые вы отправили мастерам. Информация доступна только в этом локальном кабинете.\u003C/p>\u003Cdiv id=\"myOutgoingOrders\">\u003C/div>\u003C/section>\u003Csection class=\"card panel-screen\" id=\"panel-bookings\">\u003Cdiv aria-label=\"Краткие показатели раздела\" class=\"gv-compact-kpis\" id=\"gvKpiBookings\">\u003C/div>\u003Ch3>\u003Csvg class=\"ic\">\u003Cuse href=\"#i-calendar\">\u003C/use>\u003C/svg>Бронирования\u003C/h3>\u003Cdiv class=\"empty-state\">\u003Csvg class=\"ic\">\u003Cuse href=\"#i-calendar\">\u003C/use>\u003C/svg>\u003Ch3>Здесь будут бронирования\u003C/h3>\u003Cp>Как только клиент забронирует доску, заявка появится в этом разделе.\u003C/p>\u003C/div>\u003C/section>\n\u003Csection class=\"panel-screen gv-profile-screen\" id=\"panel-profile\">\u003Cdiv class=\"card gv-profile-heading\">\u003Cdiv>\u003Ch3>\u003Csvg class=\"ic\">\u003Cuse href=\"#i-user\">\u003C/use>\u003C/svg> Профиль мастерской\u003C/h3>\u003Cp class=\"form-help\">Ваши данные, специализация, фотографии и контакты. Здесь же создаётся аккаунт шейпера.\u003C/p>\u003C/div>\u003Cbutton class=\"secondary gv-public-profile\" id=\"gvSeeOnSite\" type=\"button\">Посмотреть на сайте \u003Csvg class=\"ic ic-sm\">\u003Cuse href=\"#i-arrow\">\u003C/use>\u003C/svg>\u003C/button>\u003C/div>\u003Cform id=\"shaperForm\" novalidate=\"\">\n\u003Cdiv class=\"form-grid\">\u003Cdiv class=\"form-column\">\n\u003Csection class=\"card\">\u003Ch3>\u003Csvg class=\"ic\">\u003Cuse href=\"#i-monitor\">\u003C/use>\u003C/svg>Основная информация\u003C/h3>\u003Cdiv class=\"register-photo-block\">\u003Clabel aria-label=\"Добавить или изменить фото профиля\" class=\"avatar-edit reg-avatar\" tabindex=\"0\" title=\"Наведите, чтобы изменить фото\">\u003Cimg alt=\"Фото шейпера\" class=\"user-avatar\" src=\"img/img27.jpg\"/>\u003Cspan class=\"camera-overlay\">\u003Csvg class=\"ic\">\u003Cuse href=\"#i-camera\">\u003C/use>\u003C/svg>\u003Csmall>Выбрать фото\u003C/small>\u003C/span>\u003Cinput accept=\"image/*\" class=\"avatar-input\" hidden=\"\" type=\"file\"/>\u003C/label>\u003Cdiv>\u003Cstrong>Фото шейпера\u003C/strong>\u003Cp class=\"form-help\">Добавьте своё фото. При наведении появится кнопка изменения.\u003C/p>\u003C/div>\u003C/div>\u003Cdiv class=\"field\">\u003Clabel for=\"workshopName\">Название мастерской \u003Cspan class=\"req\">*\u003C/span>\u003C/label>\u003Cinput id=\"workshopName\" maxlength=\"90\" name=\"workshop\" placeholder=\"Например, Kamchatka Boards\" required=\"\"/>\u003C/div>\u003Cdiv class=\"spacer-10\">\u003C/div>\u003Cdiv class=\"form-row\">\u003Cdiv class=\"field\">\u003Clabel for=\"shaperFirst\">Имя \u003Cspan class=\"req\">*\u003C/span>\u003C/label>\u003Cinput id=\"shaperFirst\" name=\"first\" placeholder=\"Иван\" required=\"\"/>\u003C/div>\u003Cdiv class=\"field\">\u003Clabel for=\"shaperLast\">Фамилия \u003Cspan class=\"req\">*\u003C/span>\u003C/label>\u003Cinput id=\"shaperLast\" name=\"last\" placeholder=\"Петров\" required=\"\"/>\u003C/div>\u003C/div>\u003Cdiv class=\"spacer-10\">\u003C/div>\u003Cdiv class=\"form-row\">\u003Cdiv class=\"field\">\u003Clabel for=\"regionSelect\">Регион \u003Cspan class=\"req\">*\u003C/span>\u003C/label>\u003Cselect id=\"regionSelect\" name=\"region\" required=\"\">\u003Coption value=\"\">Выберите регион\u003C/option>\u003Coption>Камчатский край\u003C/option>\u003Coption>Приморский край\u003C/option>\u003Coption>Сахалинская область\u003C/option>\u003Coption>Калининградская область\u003C/option>\u003Coption>Краснодарский край\u003C/option>\u003Coption>Республика Крым\u003C/option>\u003Coption>Ленинградская область\u003C/option>\u003Coption>Москва и Московская область\u003C/option>\u003Coption>Другой регион\u003C/option>\u003C/select>\u003C/div>\u003Cdiv class=\"field\">\u003Clabel for=\"citySelect\">Город \u003Cspan class=\"req\">*\u003C/span>\u003C/label>\u003Cinput id=\"citySelect\" name=\"city\" placeholder=\"Выберите город\" required=\"\"/>\u003C/div>\u003C/div>\u003Cdiv class=\"spacer-10\">\u003C/div>\u003Cdiv class=\"field\" style=\"max-width:50%\">\u003Clabel for=\"experience\">Стаж в шейпинге \u003Cspan class=\"req\">*\u003C/span>\u003C/label>\u003Cselect id=\"experience\" name=\"experience\" required=\"\">\u003Coption value=\"\">Выберите стаж\u003C/option>\u003Coption>Менее года\u003C/option>\u003Coption>1–3 года\u003C/option>\u003Coption>3–5 лет\u003C/option>\u003Coption>5–10 лет\u003C/option>\u003Coption>Более 10 лет\u003C/option>\u003C/select>\u003C/div>\u003Cdiv class=\"spacer-10\">\u003C/div>\u003Cdiv class=\"field\">\u003Clabel for=\"aboutShaper\">О себе \u003Cspan class=\"req\">*\u003C/span>\u003C/label>\u003Ctextarea id=\"aboutShaper\" maxlength=\"1000\" name=\"about\" placeholder=\"Расскажите о себе, своей мастерской, философии и подходе к созданию досок...\" required=\"\">\u003C/textarea>\u003Cdiv class=\"desc-foot\">\u003Cspan id=\"aboutLength\">0\u003C/span> / 1000\u003C/div>\u003C/div>\u003C/section>\n\u003Csection class=\"card\">\u003Ch3>\u003Csvg class=\"ic\">\u003Cuse href=\"#i-board\">\u003C/use>\u003C/svg>Типы досок, которые изготавливаете\u003C/h3>\u003Cdiv class=\"board-select\" id=\"boardTypes\">\u003C/div>\u003Cbutton class=\"add-other\" id=\"addCustomType\" type=\"button\">\u003Csvg class=\"ic ic-sm\">\u003Cuse href=\"#i-plus\">\u003C/use>\u003C/svg> Добавить другие типы досок (мини-малибу, софтборд и др.)\u003C/button>\u003Cdiv class=\"chips\" id=\"customTypes\" style=\"margin-top:9px\">\u003C/div>\u003C/section>\n\u003C/div>\u003Cdiv class=\"form-column\">\n\u003Csection class=\"card\">\u003Ch3>\u003Csvg class=\"ic\">\u003Cuse href=\"#i-box\">\u003C/use>\u003C/svg>Используемые материалы\u003C/h3>\u003Cdiv class=\"chips\" id=\"materials\">\u003Clabel class=\"checkbox-pill\">\u003Cinput checked=\"\" type=\"checkbox\" value=\"Стекловолокно\"/> Стекловолокно\u003C/label>\u003Clabel class=\"checkbox-pill\">\u003Cinput checked=\"\" type=\"checkbox\" value=\"Карбон\"/> Карбон\u003C/label>\u003Clabel class=\"checkbox-pill\">\u003Cinput type=\"checkbox\" value=\"Эпоксидная смола\"/> Эпоксидная смола\u003C/label>\u003Clabel class=\"checkbox-pill\">\u003Cinput type=\"checkbox\" value=\"Полиэфирная смола\"/> Полиэфирная смола\u003C/label>\u003Clabel class=\"checkbox-pill\">\u003Cinput type=\"checkbox\" value=\"Деревянный шпон\"/> Деревянный шпон\u003C/label>\u003Clabel class=\"checkbox-pill\">\u003Cinput type=\"checkbox\" value=\"Био-смола\"/> Био-смола\u003C/label>\u003Clabel class=\"checkbox-pill\">\u003Cinput type=\"checkbox\" value=\"EPS / PU\"/> EPS / PU\u003C/label>\u003C/div>\n\u003Cbutton class=\"add-other\" id=\"addCustomMaterial\" type=\"button\">\u003Csvg class=\"ic ic-sm\">\u003Cuse href=\"#i-plus\">\u003C/use>\u003C/svg> Добавить свой материал\u003C/button>\u003C/section>\n\u003Csection class=\"card\">\u003Ch3>\u003Csvg class=\"ic\">\u003Cuse href=\"#i-truck\">\u003C/use>\u003C/svg>Доставка и сроки\u003C/h3>\u003Cdiv class=\"mini-label\">Способы доставки\u003C/div>\u003Cdiv class=\"form-row\">\u003Clabel class=\"checkline\">\u003Cinput checked=\"\" name=\"delivery\" type=\"checkbox\" value=\"Самовывоз\"/> Самовывоз\u003C/label>\u003Clabel class=\"checkline\">\u003Cinput checked=\"\" name=\"delivery\" type=\"checkbox\" value=\"Транспортная компания\"/> Транспортная компания\u003C/label>\u003Clabel class=\"checkline\">\u003Cinput name=\"delivery\" type=\"checkbox\" value=\"Почта России\"/> Почта России\u003C/label>\u003Clabel class=\"checkline\">\u003Cinput name=\"delivery\" type=\"checkbox\" value=\"Международная доставка\"/> Международная доставка\u003C/label>\u003C/div>\u003Cdiv class=\"spacer-10\">\u003C/div>\u003Cdiv class=\"form-row\">\u003Cdiv class=\"field\">\u003Clabel for=\"leadTime\">Срок изготовления \u003Cspan class=\"req\">*\u003C/span>\u003C/label>\u003Cselect id=\"leadTime\" name=\"leadTime\" required=\"\">\u003Coption value=\"\">Выберите срок\u003C/option>\u003Coption>До 2 недель\u003C/option>\u003Coption>2–4 недели\u003C/option>\u003Coption>1–2 месяца\u003C/option>\u003Coption>2–3 месяца\u003C/option>\u003Coption>По договорённости\u003C/option>\u003C/select>\u003C/div>\u003Cdiv class=\"field\">\u003Clabel>Ценовой диапазон (₽)\u003C/label>\u003Cdiv class=\"form-row\" style=\"gap:6px\">\u003Cinput min=\"0\" name=\"priceFrom\" placeholder=\"от\" type=\"number\"/>\u003Cinput min=\"0\" name=\"priceTo\" placeholder=\"до\" type=\"number\"/>\u003C/div>\u003C/div>\u003C/div>\u003Clabel class=\"toggle-row\">\u003Cinput checked=\"\" class=\"toggle\" id=\"customOrders\" type=\"checkbox\"/>\u003Cspan>\u003Cspan class=\"toggle-title\">Принимаю индивидуальные заказы\u003C/span>\u003Cspan class=\"toggle-note\" style=\"display:block\">Изготовление досок по персональным параметрам\u003C/span>\u003C/span>\u003C/label>\u003Clabel class=\"toggle-row\">\u003Cinput class=\"toggle\" id=\"rentalService\" type=\"checkbox\"/>\u003Cspan>\u003Cspan class=\"toggle-title\">Сдаю снаряжение в аренду\u003C/span>\u003Cspan class=\"toggle-note\" style=\"display:block\">Прокат досок и другого оборудования\u003C/span>\u003C/span>\u003C/label>\n\u003Clabel class=\"toggle-row\">\u003Cinput class=\"toggle\" id=\"repairService\" type=\"checkbox\"/>\u003Cspan>\u003Cspan class=\"toggle-title\">Занимаюсь ремонтом досок\u003C/span>\u003Cspan class=\"toggle-note\" style=\"display:block\">Принимаю доски на ремонт и восстановление\u003C/span>\u003C/span>\u003C/label>\u003C/section>\n\u003Csection class=\"card\">\u003Ch3>\u003Csvg class=\"ic\">\u003Cuse href=\"#i-photo\">\u003C/use>\u003C/svg>Фотографии работ\u003C/h3>\u003Cdiv class=\"upload-row\">\u003Clabel class=\"uploadzone\" for=\"worksUpload\">\u003Csvg class=\"ic\">\u003Cuse href=\"#i-upload\">\u003C/use>\u003C/svg>\u003Cspan>Загрузите фотографии ваших досок\u003C/span>\u003Csmall>Перетащите файлы сюда или выберите на компьютере\u003C/small>\u003Cinput accept=\"image/*\" hidden=\"\" id=\"worksUpload\" multiple=\"\" type=\"file\"/>\u003C/label>\u003Cdiv class=\"upload-previews\" id=\"worksPreview\">\u003Cimg alt=\"Мастерская\" src=\"img/img28.webp\"/>\u003Cimg alt=\"Работы и побережье\" src=\"img/img29.webp\"/>\u003Cspan class=\"empty\">\u003Csvg class=\"ic ic-lg\">\u003Cuse href=\"#i-plus\">\u003C/use>\u003C/svg>\u003C/span>\u003C/div>\u003C/div>\u003Cdiv class=\"form-help\">Можно загрузить до 10 фотографий (JPG, PNG, WebP).\u003C/div>\u003C/section>\n\u003Csection class=\"card gv-upload-section\">\u003Ch3>\u003Csvg class=\"ic\">\u003Cuse href=\"#i-photo\">\u003C/use>\u003C/svg> Промо-видео шейпера\u003C/h3>\n\u003Cp class=\"form-help\">Одно короткое видео о вас и мастерской. Посетители увидят его в вашей карточке при поиске по шейперам.\u003C/p>\n\u003Clabel class=\"uploadzone gv-small-upload\" for=\"promoUpload\">\u003Csvg class=\"ic\">\u003Cuse href=\"#i-upload\">\u003C/use>\u003C/svg>\u003Cspan>Загрузить промо-видео\u003C/span>\u003Csmall>MP4 или WebM · до 80 МБ · 1 видео\u003C/small>\u003C/label>\n\u003Cinput accept=\"video/mp4,video/webm,video/*\" hidden=\"\" id=\"promoUpload\" type=\"file\"/>\n\u003Cdiv class=\"form-help\" id=\"promoStatus\">\u003C/div>\u003Cdiv aria-live=\"polite\" class=\"gv-video-display\" id=\"promoPreview\">\u003C/div>\n\u003C/section>\n\u003C/div>\u003C/div>\n\u003Cdiv class=\"reg-bottom\">\u003Csection class=\"card\">\u003Ch3>\u003Csvg class=\"ic\">\u003Cuse href=\"#i-link\">\u003C/use>\u003C/svg>Контакты и социальные сети\u003C/h3>\u003Cdiv class=\"form-row\" style=\"grid-template-columns:1fr 1fr 1.2fr\">\u003Cdiv class=\"field\">\u003Clabel for=\"phone\">Телефон \u003Cspan class=\"req\">*\u003C/span>\u003C/label>\u003Cinput autocomplete=\"tel\" id=\"phone\" inputmode=\"numeric\" maxlength=\"16\" name=\"phone\" pattern=\"\\+7 \\d{3} \\d{3} \\d{2} \\d{2}\" placeholder=\"+7 965 285 87 81\" required=\"\" type=\"tel\"/>\u003C/div>\u003Cdiv class=\"field\">\u003Clabel for=\"email\">Email \u003Cspan class=\"req\">*\u003C/span>\u003C/label>\u003Cinput id=\"email\" name=\"email\" placeholder=\"example@mail.ru\" required=\"\" type=\"email\"/>\u003C/div>\u003Cdiv class=\"field\">\u003Clabel for=\"address\">Адрес мастерской\u003C/label>\u003Cinput id=\"address\" name=\"address\" placeholder=\"Укажите адрес\"/>\u003C/div>\u003C/div>\u003Cdiv class=\"spacer-10\">\u003C/div>\u003Cdiv class=\"form-row\" style=\"grid-template-columns:repeat(4,minmax(0,1fr))\">\u003Cdiv class=\"field\">\u003Clabel>Telegram\u003C/label>\u003Cinput name=\"telegram\" placeholder=\"@мастерская\"/>\u003C/div>\u003Cdiv class=\"field\">\u003Clabel>VK\u003C/label>\u003Cinput name=\"vk\" placeholder=\"vk.com/...\"/>\u003C/div>\u003Cdiv class=\"field\">\u003Clabel>Видео\u003C/label>\u003Cinput name=\"youtube\" placeholder=\"Ссылка на канал\"/>\u003C/div>\u003Cdiv class=\"field\">\u003Clabel>Сайт\u003C/label>\u003Cinput name=\"website\" placeholder=\"https://...\"/>\u003C/div>\u003C/div>\u003C/section>\u003Csection class=\"card\">\u003Ch3>\u003Csvg class=\"ic\">\u003Cuse href=\"#i-upload\">\u003C/use>\u003C/svg>Сертификаты и достижения\u003C/h3>\u003Clabel class=\"uploadzone\" for=\"certificateUpload\">\u003Csvg class=\"ic\">\u003Cuse href=\"#i-upload\">\u003C/use>\u003C/svg>\u003Cspan>Загрузите сертификаты (необязательно)\u003C/span>\u003Csmall>JPG, PNG или PDF\u003C/small>\u003Cinput accept=\"image/*,.pdf\" hidden=\"\" id=\"certificateUpload\" multiple=\"\" type=\"file\"/>\u003C/label>\u003Cdiv class=\"form-help\" id=\"certificateNames\">Можно добавить позже в личном кабинете.\u003C/div>\u003C/section>\u003C/div>\n\u003Cbutton class=\"primary reg-cta\" id=\"profileSaveButton\" type=\"submit\">Зарегистрироваться как шейпер\u003C/button>\u003Cp class=\"footer-note\">Демонстрационная версия: данные сохраняются в этом браузере. Для настоящей регистрации потребуется сервер.\u003C/p>\n\u003C/form>\u003C/section>\n\u003Csection class=\"card panel-screen\" id=\"panel-statistics\">\u003Cdiv aria-label=\"Краткие показатели раздела\" class=\"gv-compact-kpis\" id=\"gvKpiStatistics\">\u003C/div>\u003Cdiv class=\"section-head\">\u003Ch3>\u003Csvg class=\"ic\">\u003Cuse href=\"#i-graph\">\u003C/use>\u003C/svg> Статистика мастерской\u003C/h3>\u003Cspan class=\"form-help\">По сохранённым данным этого браузера\u003C/span>\u003C/div>\u003Cdiv class=\"gv-stat-grid\" id=\"gvStatsGrid\">\u003C/div>\u003Cdiv class=\"gv-stat-panels\">\u003Csection class=\"gv-stat-detail\">\u003Ch3>Структура заявок\u003C/h3>\u003Cdiv id=\"gvStatsFunnel\">\u003C/div>\u003C/section>\u003Csection class=\"gv-stat-detail\">\u003Ch3>Ваши типы досок\u003C/h3>\u003Cdiv id=\"gvStatsTypes\">\u003C/div>\u003C/section>\u003C/div>\u003Ch3 style=\"margin-top:22px\">Итоги сделок\u003C/h3>\u003Cdiv class=\"stat-summary-note\" id=\"statCopy\">\u003C/div>\u003Cp class=\"form-help\">Просмотры и отметки избранного в исходных демонстрационных моделях — тестовые значения. До подключения серверной аналитики показаны только локальные и демонстрационные данные.\u003C/p>\u003C/section>\n\u003Csection class=\"card panel-screen\" id=\"panel-reviews\">\u003Ch3>\u003Csvg class=\"ic\">\u003Cuse href=\"#i-star\">\u003C/use>\u003C/svg>Отзывы о вашей мастерской\u003C/h3>\u003Cdiv class=\"request-item gv-review-item\">\u003Cimg alt=\"Фото автора отзыва (демо)\" class=\"gv-review-avatar\" id=\"gvDemoReviewerPhoto\" loading=\"lazy\"/>\u003Cspan class=\"star\" style=\"font-size:27px\">★★★★★\u003C/span>\u003Cdiv class=\"request-copy\">\u003Cstrong>Алексей\u003C/strong>\u003Csmall>«Классная доска, всё выполнено аккуратно. Спасибо!»\u003C/small>\u003C/div>\u003C/div>\u003Cp class=\"form-help\">Пример отзыва. Реальные отзывы будут доступны после подтверждённых заказов.\u003C/p>\u003C/section>\n\u003Csection class=\"card panel-screen\" id=\"panel-settings\">\u003Ch3>\u003Csvg class=\"ic\">\u003Cuse href=\"#i-settings\">\u003C/use>\u003C/svg>Настройки\u003C/h3>\u003Clabel class=\"checkline\">\u003Cinput checked=\"\" type=\"checkbox\"/> Получать уведомления о новых заявках\u003C/label>\u003Clabel class=\"checkline\">\u003Cinput checked=\"\" type=\"checkbox\"/> Показывать мастерскую в каталоге\u003C/label>\u003Cp class=\"form-help\">Настройки пока действуют только в этой демонстрации.\u003C/p>\u003C/section>\n\u003C/main>\u003C/div>\u003Cp class=\"footer-note\">Демонстрационный кабинет. Все данные хранятся локально и не передаются другим пользователям.\u003C/p>\u003C/div>\u003C/section>\u003Csection aria-label=\"Каталог шейперов и досок\" class=\"pane\" id=\"catalog\">\u003Cdiv class=\"hero dash catalog-hero\">\u003Cdiv class=\"hero-copy\">\u003Cdiv class=\"bread\">Главная / Мастерские и доски\u003C/div>\u003Ch1>Каталог шейперов\u003C/h1>\u003Cp>Найдите доску под свою волну — у мастеров со всей России.\u003C/p>\u003C/div>\u003C/div>\u003Cdiv class=\"content\">\u003Cdiv class=\"catalog-tools card\">\u003Cdiv class=\"catalog-switch\">\u003Cbutton class=\"tab active\" id=\"catalogAllBtn\" type=\"button\">Все доски\u003C/button>\u003Cbutton class=\"tab\" id=\"catalogMakersBtn\" type=\"button\">По шейперам\u003C/button>\u003C/div>\u003Cdiv class=\"catalog-filters\">\u003Clabel class=\"field\">Поиск\u003Cinput id=\"catalogQuery\" placeholder=\"Модель, тип, мастерская...\"/>\u003C/label>\u003Clabel class=\"field\">Тип доски\u003Cselect id=\"catalogType\">\u003Coption value=\"\">Все типы\u003C/option>\u003Coption>Лонгборд\u003C/option>\u003Coption>Шортборд\u003C/option>\u003Coption>Фанборд\u003C/option>\u003Coption>Фиш\u003C/option>\u003Coption>SUP\u003C/option>\u003Coption>Кастом\u003C/option>\u003C/select>\u003C/label>\u003Clabel class=\"field\">Я смотрю как\u003Cselect id=\"buyerRole\">\u003Coption value=\"Сёрфер\">Сёрфер\u003C/option>\u003Coption value=\"Инструктор\">Сёрф-инструктор\u003C/option>\u003Coption value=\"Школа\">Сёрф-школа\u003C/option>\u003Coption value=\"Шейпер\">Шейпер (мой аккаунт)\u003C/option>\u003C/select>\u003C/label>\u003C/div>\u003Cp class=\"form-help\">Смена роли здесь — только демонстрация. В реальном сервисе роль определяется аккаунтом. Заказ собственных досок для шейпера заблокирован.\u003C/p>\u003C/div>\u003Cdiv class=\"section-head\" style=\"margin-top:20px\">\u003Ch3 id=\"catalogHeading\">Все доски\u003C/h3>\u003Cspan class=\"muted\" id=\"catalogCount\">\u003C/span>\u003C/div>\u003Cdiv class=\"models catalog-models\" id=\"catalogBoards\">\u003C/div>\u003Cdiv class=\"maker-list\" hidden=\"\" id=\"catalogMakers\">\u003C/div>\u003C/div>\u003C/section>\n\u003C/div>\u003C/div>\n\u003Cdiv aria-labelledby=\"orderTitle\" aria-modal=\"true\" class=\"overlay\" id=\"orderOverlay\" role=\"dialog\">\u003Cdiv class=\"modal\">\u003Cbutton aria-label=\"Закрыть\" class=\"iconbtn close\" onclick=\"closeOrderModal()\" type=\"button\">×\u003C/button>\u003Ch2 id=\"orderTitle\">Заказать доску\u003C/h2>\u003Cdiv class=\"form-help\" id=\"orderInfo\">\u003C/div>\u003Cform id=\"orderForm\">\u003Cdiv class=\"modal-fields\">\u003Cdiv class=\"field\">\u003Clabel for=\"orderBuyer\">Ваше имя *\u003C/label>\u003Cinput id=\"orderBuyer\" placeholder=\"Имя покупателя\" required=\"\"/>\u003C/div>\u003Cdiv class=\"field\">\u003Clabel for=\"orderContact\">Контакт для связи *\u003C/label>\u003Cinput id=\"orderContact\" placeholder=\"Телефон или email\" required=\"\"/>\u003C/div>\u003Cdiv class=\"field\">\u003Clabel for=\"orderKind\">Тип заявки\u003C/label>\u003Cselect id=\"orderKind\">\u003Coption value=\"Покупка\">Покупка\u003C/option>\u003Coption value=\"Аренда\">Аренда (если доступна)\u003C/option>\u003C/select>\u003C/div>\u003C/div>\u003Cdiv class=\"field\" style=\"margin-top:12px\">\u003Clabel for=\"orderComment\">Пожелания к заказу\u003C/label>\u003Ctextarea id=\"orderComment\" placeholder=\"Размер, цвет, доставка, сроки...\">\u003C/textarea>\u003C/div>\u003Cp class=\"form-help\">Заявка сохраняется локально. Реальный заказ и платёж не создаются.\u003C/p>\u003Cdiv class=\"modal-actions\">\u003Cbutton class=\"secondary\" onclick=\"closeOrderModal()\" type=\"button\">Отмена\u003C/button>\u003Cbutton class=\"primary\" type=\"submit\">Отправить заявку\u003C/button>\u003C/div>\u003C/form>\u003C/div>\u003C/div>\u003Cdiv aria-labelledby=\"modalTitle\" aria-modal=\"true\" class=\"overlay\" id=\"boardOverlay\" role=\"dialog\">\u003Cdiv class=\"modal\">\u003Cbutton aria-label=\"Закрыть\" class=\"iconbtn close\" onclick=\"closeBoardModal()\">\u003Csvg class=\"ic\">\u003Cuse href=\"#i-close\">\u003C/use>\u003C/svg>\u003C/button>\u003Ch2 id=\"modalTitle\">Добавить новую доску\u003C/h2>\u003Cform id=\"boardForm\">\u003Cdiv class=\"modal-fields\">\u003Cdiv class=\"field\">\u003Clabel for=\"modelName\">Название модели \u003Cspan class=\"req\">*\u003C/span>\u003C/label>\u003Cinput id=\"modelName\" placeholder=\"Например, Pacific Fish\" required=\"\"/>\u003C/div>\u003Cdiv class=\"field\">\u003Clabel for=\"modelArticle\">Артикул\u003C/label>\u003Cinput id=\"modelArticle\" readonly=\"\" title=\"Артикул: код шейпера · тип доски · длина · ширина · постоянный порядковый номер\" value=\"Присвоится автоматически\"/>\u003Csmall class=\"gv-article-hint\">Код присваивается автоматически для всего каталога. Изменение типа или размеров обновляет код, а порядковый номер модели сохраняется.\u003C/small>\u003C/div>\n\u003Cdiv class=\"field\">\u003Clabel for=\"modelType\">Тип доски \u003Cspan class=\"req\">*\u003C/span>\u003C/label>\u003Cselect id=\"modelType\" required=\"\">\u003Coption value=\"\">Выберите тип\u003C/option>\u003Coption>Лонгборд\u003C/option>\u003Coption>Шортборд\u003C/option>\u003Coption>Фанборд\u003C/option>\u003Coption>Фиш\u003C/option>\u003Coption>SUP\u003C/option>\u003Coption>Кастом\u003C/option>\u003C/select>\u003C/div>\u003Cdiv class=\"field\">\u003Clabel for=\"modelLength\">Длина\u003C/label>\u003Cinput id=\"modelLength\" placeholder=\"Например, 9’2”\" required=\"\"/>\u003C/div>\u003Cdiv class=\"field\">\u003Clabel for=\"modelDimensions\">Ширина и толщина\u003C/label>\u003Cinput id=\"modelDimensions\" placeholder=\"22” × 2.8”\" required=\"\"/>\u003C/div>\u003Cdiv class=\"field\">\u003Clabel for=\"modelVolume\">Объём (л)\u003C/label>\u003Cinput id=\"modelVolume\" max=\"300\" min=\"0\" placeholder=\"65\" type=\"number\"/>\u003C/div>\u003Cdiv class=\"field\">\u003Clabel for=\"modelPrice\">Цена (₽) \u003Cspan class=\"req\">*\u003C/span>\u003C/label>\u003Cinput id=\"modelPrice\" min=\"1\" placeholder=\"75000\" required=\"\" type=\"number\"/>\u003C/div>\u003Cdiv class=\"field\">\u003Clabel for=\"modelStatus\">Наличие\u003C/label>\u003Cselect id=\"modelStatus\">\u003Coption>В наличии\u003C/option>\u003Coption>Под заказ\u003C/option>\u003Coption>Нет в наличии\u003C/option>\u003C/select>\u003C/div>\u003Cdiv class=\"field\">\u003Clabel for=\"modelMaterial\">Материалы\u003C/label>\u003Cinput id=\"modelMaterial\" placeholder=\"Стекловолокно, эпоксидная смола\"/>\u003C/div>\n\u003Cdiv class=\"field\">\u003Clabel for=\"modelFinBox\">Вид закладных\u003C/label>\u003Cinput id=\"modelFinBox\" list=\"gvFinBoxOptions\" placeholder=\"Например, FCS II или Futures\"/>\u003Cdatalist id=\"gvFinBoxOptions\">\u003Coption value=\"FCS II\">\u003Coption value=\"FCS I\">\u003Coption value=\"Futures\">\u003Coption value=\"US Box\">\u003Coption value=\"Single Fin\">\u003Coption value=\"2+1\">\u003Coption value=\"Thruster\">\u003Coption value=\"Quad\">\u003Coption value=\"Без закладных\">\u003C/option>\u003C/option>\u003C/option>\u003C/option>\u003C/option>\u003C/option>\u003C/option>\u003C/option>\u003C/option>\u003C/datalist>\u003C/div>\u003C/div>\u003Cdiv class=\"field\" style=\"margin-top:12px\">\u003Clabel for=\"modelDescription\">Описание\u003C/label>\u003Ctextarea id=\"modelDescription\" placeholder=\"Для каких волн и райдеров подходит доска...\">\u003C/textarea>\u003C/div>\u003Cdiv class=\"field\" style=\"margin-top:12px\">\u003Clabel for=\"modelPhoto\">Фотографии доски\u003C/label>\u003Clabel class=\"uploadzone model-upload\" for=\"modelPhoto\">\u003Csvg class=\"ic\">\u003Cuse href=\"#i-upload\">\u003C/use>\u003C/svg>\u003Cstrong>Загрузите фотографии доски\u003C/strong>\u003Csmall>Выберите несколько файлов · JPG, PNG, WEBP · до 10 фото\u003C/small>\u003Cspan class=\"upload-filename\" id=\"modelPhotoName\">Фото ещё не выбрано\u003C/span>\u003Cimg alt=\"Предпросмотр модели\" hidden=\"\" id=\"modelPhotoPreview\"/>\u003C/label>\u003Cinput accept=\"image/*\" class=\"visually-hidden\" id=\"modelPhoto\" multiple=\"\" type=\"file\"/>\n\u003Cdiv aria-label=\"Загруженные фотографии доски\" class=\"gv-gallery-row\" id=\"modelPhotoGallery\">\u003C/div>\u003C/div>\u003Cdiv class=\"field gv-video-slot\">\u003Clabel for=\"modelVideo\">Видео доски\u003C/label>\u003Clabel class=\"uploadzone gv-small-upload\" for=\"modelVideo\">\u003Csvg class=\"ic\">\u003Cuse href=\"#i-upload\">\u003C/use>\u003C/svg>\u003Cspan>Добавить видео доски\u003C/span>\u003Csmall>Отдельно от фотографий · MP4 / WebM · до 80 МБ\u003C/small>\u003Cspan class=\"upload-filename\" id=\"modelVideoName\">Видео ещё не выбрано\u003C/span>\u003C/label>\u003Cinput accept=\"video/mp4,video/webm,video/*\" hidden=\"\" id=\"modelVideo\" type=\"file\"/>\u003Cdiv class=\"gv-video-display\" id=\"modelVideoPreview\">\u003C/div>\u003C/div>\n\u003Cdiv class=\"modal-actions\">\u003Cbutton class=\"secondary\" onclick=\"closeBoardModal()\" type=\"button\">Отмена\u003C/button>\u003Cbutton class=\"primary\" type=\"submit\">Сохранить\u003C/button>\u003C/div>\u003C/form>\u003C/div>\u003C/div>\n\u003Cdiv aria-labelledby=\"gvViewerTitle\" aria-modal=\"true\" class=\"overlay\" id=\"gvViewerOverlay\" role=\"dialog\">\u003Cdiv class=\"modal gv-viewer-modal\">\n\u003Cbutton aria-label=\"Закрыть\" class=\"iconbtn close\" onclick=\"document.getElementById('gvViewerOverlay').classList.remove('open');document.getElementById('gvViewerFrame').pause()\" type=\"button\">\u003Csvg class=\"ic\">\u003Cuse href=\"#i-close\">\u003C/use>\u003C/svg>\u003C/button>\n\u003Ch2 id=\"gvViewerTitle\">Доска\u003C/h2>\u003Cp class=\"gv-modal-subtitle\" id=\"gvViewerArticle\">\u003C/p>\n\u003Cdiv class=\"gv-viewer-body\">\u003Cdiv>\u003Cdiv class=\"gv-viewer-main\">\u003Cimg alt=\"Фотография доски\" id=\"gvViewerMain\"/>\u003Cvideo controls=\"\" hidden=\"\" id=\"gvViewerFrame\" playsinline=\"\" preload=\"metadata\">\u003C/video>\u003C/div>\u003Cdiv class=\"gv-viewer-thumbs\" id=\"gvViewerThumbs\">\u003C/div>\u003C/div>\u003Cdiv class=\"gv-viewer-specs\" id=\"gvViewerSpecs\">\u003C/div>\u003C/div>\n\u003C/div>\u003C/div>\n\u003Cdiv aria-labelledby=\"gvPromoTitle\" aria-modal=\"true\" class=\"overlay\" id=\"gvPromoOverlay\" role=\"dialog\">\u003Cdiv class=\"modal\">\u003Cbutton aria-label=\"Закрыть\" class=\"iconbtn close\" onclick=\"document.getElementById('gvPromoPlayer').pause();document.getElementById('gvPromoOverlay').classList.remove('open')\" type=\"button\">\u003Csvg class=\"ic\">\u003Cuse href=\"#i-close\">\u003C/use>\u003C/svg>\u003C/button>\u003Ch2 id=\"gvPromoTitle\">Промо-видео шейпера\u003C/h2>\u003Cp class=\"form-help\">Знакомство с мастерской и её работами\u003C/p>\u003Cvideo class=\"gv-video-preview\" controls=\"\" id=\"gvPromoPlayer\" playsinline=\"\" preload=\"metadata\" style=\"width:100%;max-height:460px\">\u003C/video>\u003C/div>\u003C/div>\n\u003Cdiv aria-labelledby=\"gvShaperTitle\" aria-modal=\"true\" class=\"overlay\" id=\"gvShaperOverlay\" role=\"dialog\">\u003Cdiv class=\"modal gv-profile-modal\">\n\u003Cbutton aria-label=\"Закрыть профиль шейпера\" class=\"iconbtn close\" id=\"gvShaperClose\" type=\"button\">\u003Csvg class=\"ic\">\u003Cuse href=\"#i-close\">\u003C/use>\u003C/svg>\u003C/button>\n\u003Cdiv class=\"gv-profile-topline\">ГДЕВОЛНА · МАСТЕРСКАЯ\u003C/div>\n\u003Ch2 id=\"gvShaperTitle\">Шейпер\u003C/h2>\n\u003Cdiv class=\"gv-profile-content\" id=\"gvShaperContent\">\u003C/div>\n\u003C/div>\u003C/div>\n\u003Cdiv aria-modal=\"true\" class=\"overlay\" id=\"chatOverlay\" role=\"dialog\">\u003Cdiv class=\"modal gv-chat-modal\">\u003Cbutton class=\"iconbtn close\" onclick=\"document.getElementById('chatOverlay').classList.remove('open')\">\u003Csvg class=\"ic\">\u003Cuse href=\"#i-close\">\u003C/use>\u003C/svg>\u003C/button>\u003Ch2 id=\"chatTitle\">Сообщения\u003C/h2>\u003Cdiv class=\"chatlog\" id=\"chatLog\">\u003C/div>\u003Cdiv class=\"chat-actions\" id=\"chatActions\">\u003C/div>\u003Cdiv class=\"gv-chat-attachment-preview\" hidden=\"\" id=\"gvChatAttachmentPreview\">\u003C/div>\u003Cform class=\"gv-chat-form\" id=\"chatForm\">\u003Clabel aria-label=\"Прикрепить фото\" class=\"gv-paperclip\" for=\"gvChatAttach\" title=\"Прикрепить фото\">\u003Csvg class=\"ic\">\u003Cuse href=\"#i-link\">\u003C/use>\u003C/svg>\u003Cinput accept=\"image/jpeg,image/png,image/webp\" hidden=\"\" id=\"gvChatAttach\" type=\"file\"/>\u003C/label>\u003Cinput autocomplete=\"off\" id=\"chatInput\" placeholder=\"Напишите сообщение или прикрепите фото…\"/>\u003Cbutton class=\"primary\" type=\"submit\">Отправить\u003C/button>\u003C/form>\u003Cp class=\"form-help\">Демо-чат сохраняется в этом браузере. Для сообщений между разными пользователями и устройствами потребуется подключить сервер.\u003C/p>\u003C/div>\u003C/div>\u003Cdiv class=\"toast\" id=\"toast\" role=\"status\">\u003C/div>\n\u003Cscript>\nconst IMG={avatar:'img/img30.jpg',boards:['img/img31.png','img/img32.png','img/img33.png','img/img34.png','img/img35.png','img/img36.png']};\nconst KEY='gdevolna_shaper_demo_v1';const FKEY='gdevolna_shaper_files_v1';let editingId=null,boardFilter='all',chatPerson='';const icons=(name,cls='')=>`\u003Csvg class=\"ic ${cls}\">\u003Cuse href=\"#i-${name}\">\u003C/use>\u003C/svg>`;let data;\nconst starterModels=[{id:1,name:'Kamchatka Classic',type:'Лонгборд',length:'9’2”',dimensions:'22” × 2.8”',volume:65,price:75000,status:'В наличии',board:0,views:124,hearts:18},{id:2,name:'Volcano',type:'Шортборд',length:'6’1”',dimensions:'18.5” × 2.4”',volume:32,price:68000,status:'В наличии',board:2,views:96,hearts:12},{id:3,name:'Pacific Fish',type:'Фиш',length:'5’8”',dimensions:'20.5” × 2.6”',volume:38,price:62000,status:'Под заказ',board:4,views:87,hearts:9},{id:4,name:'Lava Mid',type:'Фанборд',length:'7’0”',dimensions:'21.5” × 2.9”',volume:48,price:69000,status:'Нет в наличии',board:5,views:152,hearts:26}];\nconst starterRequests=[{id:1,name:'Алексей Смирнов',title:'Индивидуальный заказ',text:'Добрый день! Интересует изготовление шортборда под мой рост...',ago:'2 часа назад',status:'Новая'},{id:2,name:'Мария Ковалёва',title:'Вопрос о модели',text:'Здравствуйте! Есть ли возможность сделать доску по другим параметрам?',ago:'1 день назад',status:'В работе'},{id:3,name:'Дмитрий Волков',title:'Pacific Fish',text:'Интересует ваша модель Pacific Fish. Можно ли заказать с другим плавником?',ago:'1 день назад',status:'Новая'}];\nfunction initData(){try{data=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!data||!Array.isArray(data.models))data={profile:{},models:starterModels,requests:starterRequests,chat:{},custom:[]};if(!data.requests)data.requests=starterRequests;if(!data.chat)data.chat={};if(!data.custom)data.custom=[];}\nfunction save(){try{localStorage.setItem(KEY,JSON.stringify(data));}catch(e){toast('Память браузера заполнена. Удалите часть загруженных фотографий.')}}\nfunction toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('visible');clearTimeout(window.ttt);window.ttt=setTimeout(()=>el.classList.remove('visible'),3500)}\nfunction showPage(page){document.querySelectorAll('.pane').forEach(x=>x.classList.toggle('active',x.id===page));if(page==='dashboard'){updateProfile();renderAll()}window.scrollTo({top:0,behavior:'smooth'});document.getElementById('mobileNav').classList.remove('open');}\nconst types=['Лонгборд','Шортборд','Фанборд','Фиш','SUP','Кастом'];\nfunction renderTypeChoices(){let selected=data.profile?.types||['Шортборд'];document.getElementById('boardTypes').innerHTML=types.map((t,i)=>`\u003Cbutton type=\"button\" class=\"board-option ${selected.includes(t)?'selected':''}\" data-type=\"${t}\" aria-pressed=\"${selected.includes(t)}\">\u003Cimg src=\"${IMG.boards[i]}\" alt=\"${t}\">\u003Cspan>${t}\u003C/span>\u003Cspan class=\"checkmark\">${icons('check','ic-sm')}\u003C/span>\u003C/button>`).join('');document.querySelectorAll('.board-option').forEach(b=>b.onclick=()=>{b.classList.toggle('selected');b.setAttribute('aria-pressed',b.classList.contains('selected'))});document.getElementById('customTypes').innerHTML=data.custom.map(t=>`\u003Cspan class=\"checkbox-pill\">${escapeHtml(t)} \u003Cbutton class=\"plain\" type=\"button\" data-delcustom=\"${escapeHtml(t)}\">×\u003C/button>\u003C/span>`).join('');document.querySelectorAll('[data-delcustom]').forEach(b=>b.onclick=()=>{data.custom=data.custom.filter(t=>t!==b.dataset.delcustom);save();renderTypeChoices()})}\nfunction escapeHtml(v){return String(v??'').replace(/[&\u003C>\"']/g,x=>({'&':'&amp;','\u003C':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[x]));}\nfunction money(v){return Number(v||0).toLocaleString('ru-RU')+' ₽'}\nfunction modelCard(m){let cls=m.status==='В наличии'?'available':m.status==='Под заказ'?'made':'none';let photo=m.photo||IMG.boards[m.board??0];return `\u003Carticle class=\"model\">\u003Cdiv class=\"model-visual\">\u003Cimg src=\"${photo}\" alt=\"Доска ${escapeHtml(m.name)}\" loading=\"lazy\">\u003Cspan class=\"status ${cls}\">${escapeHtml(m.status)}\u003C/span>\u003Cbutton class=\"model-menu\" data-edit=\"${m.id}\" aria-label=\"Изменить ${escapeHtml(m.name)}\">${icons('more')}\u003C/button>\u003C/div>\u003Cdiv class=\"model-info\">\u003Cstrong>${escapeHtml(m.name)}\u003C/strong>\u003Cdiv class=\"model-type\">${escapeHtml(m.type)}\u003C/div>\u003Cspan class=\"model-param\">♧ ${escapeHtml(m.length||'—')} · ${escapeHtml(m.dimensions||'—')}\u003C/span>\u003Cspan class=\"model-param\">♧ ${escapeHtml(m.volume||'—')} л\u003C/span>\u003Cdiv class=\"model-price\">${money(m.price)}\u003C/div>\u003Cdiv class=\"model-foot\">\u003Cspan>${icons('views')} ${m.views||0}\u003C/span>\u003Cspan>${icons('heart')} ${m.hearts||0}\u003C/span>\u003C/div>\u003C/div>\u003C/article>`}\nfunction renderAll(){document.getElementById('countBoards').textContent=data.models.length;document.getElementById('countOrders').textContent=data.requests.filter(x=>x.status==='Новая').length;document.getElementById('requestNavCount').textContent=data.requests.filter(x=>x.status==='Новая').length;document.getElementById('overviewModels').innerHTML=data.models.slice(0,4).map(modelCard).join('')||'\u003Cp class=\"muted\">Добавьте вашу первую модель доски.\u003C/p>';const shown=boardFilter==='all'?data.models:data.models.filter(m=>m.status===boardFilter);document.getElementById('allModels').innerHTML=shown.map(modelCard).join('')||'\u003Cp class=\"muted\">Моделей с таким статусом пока нет.\u003C/p>';document.getElementById('overviewRequests').innerHTML=data.requests.slice(0,3).map(requestMarkup).join('');document.getElementById('allRequests').innerHTML=data.requests.map(r=>`\u003Cdiv class=\"request-item\">\u003Cdiv class=\"request-copy\">\u003Cstrong>${escapeHtml(r.name)} · ${escapeHtml(r.title)}\u003C/strong>\u003Csmall>${escapeHtml(r.text)}\u003C/small>\u003C/div>\u003Cdiv>\u003Cdiv class=\"request-date\">${escapeHtml(r.ago)}\u003C/div>\u003Cspan class=\"badge ${r.status==='В работе'?'pending':r.status==='Завершена'?'done':''}\">${escapeHtml(r.status)}\u003C/span>\u003C/div>\u003Cbutton class=\"secondary\" data-answer=\"${r.id}\">${r.status==='Новая'?'Принять':'Написать'}\u003C/button>\u003C/div>`).join('');document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openBoardModal(Number(b.dataset.edit)));document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{const x=data.requests.find(x=>x.id===Number(b.dataset.answer));if(x.status==='Новая'){x.status='В работе';save();renderAll()}openChat(x.name)});}\nfunction requestMarkup(r){return `\u003Cdiv class=\"request-item\">\u003Cimg class=\"mini-avatar\" src=\"${IMG.avatar}\">\u003Cdiv class=\"request-copy\">\u003Cstrong>${escapeHtml(r.name)}\u003C/strong>\u003Csmall>${escapeHtml(r.title)}\u003C/small>\u003Csmall>${escapeHtml(r.text)}\u003C/small>\u003C/div>\u003Cdiv>\u003Cdiv class=\"request-date\">${escapeHtml(r.ago)}\u003C/div>\u003Cspan class=\"badge ${r.status==='В работе'?'pending':r.status==='Завершена'?'done':''}\">${escapeHtml(r.status)}\u003C/span>\u003C/div>\u003C/div>`}\nfunction switchPanel(p){document.querySelectorAll('.panel-screen').forEach(x=>x.classList.toggle('active',x.id==='panel-'+p));document.querySelectorAll('.side-link').forEach(x=>x.classList.toggle('active',x.dataset.panel===p));renderAll();}\nfunction updateProfile(){const p=data.profile||{};document.getElementById('sideName').textContent=(p.first&&p.last)?p.first+' '+p.last:'Иван Петров';document.getElementById('sideCompany').textContent=p.workshop||'Kamchatka Boards';}\nfunction openBoardModal(id){editingId=id||null;document.getElementById('modalTitle').textContent=id?'Редактировать модель доски':'Добавить новую доску';document.getElementById('boardForm').reset();if(id){const m=data.models.find(x=>x.id===id);if(m){for(const [key,field] of Object.entries({name:'modelName',type:'modelType',length:'modelLength',dimensions:'modelDimensions',volume:'modelVolume',price:'modelPrice',status:'modelStatus',material:'modelMaterial',description:'modelDescription'})){document.getElementById(field).value=m[key]||''}}}document.getElementById('boardOverlay').classList.add('open')}\nfunction closeBoardModal(){document.getElementById('boardOverlay').classList.remove('open')}\nfunction readImage(file,callback){if(!file)return;const reader=new FileReader();reader.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');const scale=Math.min(1,950/im.width,950/im.height);c.width=Math.round(im.width*scale);c.height=Math.round(im.height*scale);c.getContext('2d').drawImage(im,0,0,c.width,c.height);callback(c.toDataURL('image/jpeg',.82))};im.src=reader.result};reader.readAsDataURL(file)}\nfunction openChat(person){chatPerson=person;document.getElementById('chatTitle').textContent='Чат · '+person;const arr=data.chat[person]||[{me:false,text:'Здравствуйте! Буду рад обсудить детали заказа.'}];document.getElementById('chatLog').innerHTML=arr.map(x=>`\u003Cdiv class=\"bubble ${x.me?'me':''}\">${escapeHtml(x.text)}\u003C/div>`).join('');document.getElementById('chatOverlay').classList.add('open')}\nfunction attachEvents(){document.getElementById('aboutShaper').addEventListener('input',e=>document.getElementById('aboutLength').textContent=e.target.value.length);document.getElementById('addCustomType').onclick=()=>{const t=prompt('Какой ещё тип досок вы изготавливаете?');if(t&&t.trim()&&!data.custom.includes(t.trim())){data.custom.push(t.trim().slice(0,35));save();renderTypeChoices()}};\n document.querySelectorAll('.avatar-input').forEach(input=>input.onchange=e=>readImage(e.target.files[0],img=>{document.querySelectorAll('.user-avatar').forEach(x=>x.src=img);try{localStorage.setItem(FKEY,img)}catch(err){}toast('Фотография профиля обновлена')}));\n document.getElementById('worksUpload').onchange=e=>{const files=[...e.target.files].slice(0,10);const list=document.getElementById('worksPreview');list.innerHTML='';files.forEach(file=>readImage(file,img=>{const el=new Image();el.src=img;el.alt='Фото работы';list.appendChild(el)}));toast('Добавлено фотографий: '+files.length)};\n document.getElementById('certificateUpload').onchange=e=>{document.getElementById('certificateNames').textContent=[...e.target.files].map(x=>x.name).join(', ')||'Документы не выбраны'};\n document.getElementById('shaperForm').onsubmit=e=>{e.preventDefault();const form=e.target;if(!form.checkValidity()){form.reportValidity();return}const p=Object.fromEntries(new FormData(form).entries());p.types=[...document.querySelectorAll('.board-option.selected')].map(x=>x.dataset.type).concat(data.custom);if(!p.types.length){toast('Выберите хотя бы один тип досок');document.getElementById('boardTypes').scrollIntoView({behavior:'smooth',block:'center'});return}p.materials=[...document.querySelectorAll('#materials input:checked')].map(x=>x.value);p.delivery=[...document.querySelectorAll('[name=delivery]:checked')].map(x=>x.value);p.customOrders=document.getElementById('customOrders').checked;p.rentalService=document.getElementById('rentalService').checked;data.profile=p;save();updateProfile();showPage('dashboard');toast('Профиль мастерской сохранён! Теперь можете добавлять модели.')};\n document.getElementById('boardForm').onsubmit=e=>{e.preventDefault();if(!e.target.checkValidity()){e.target.reportValidity();return}const v=Object.fromEntries([['name','modelName'],['type','modelType'],['length','modelLength'],['dimensions','modelDimensions'],['volume','modelVolume'],['price','modelPrice'],['status','modelStatus'],['material','modelMaterial'],['description','modelDescription']].map(([k,i])=>[k,document.getElementById(i).value]));const existing=editingId?data.models.find(x=>x.id===editingId):null;const m={...existing,...v,id:editingId||Date.now(),board:types.indexOf(v.type)>=0?types.indexOf(v.type):0,views:existing?.views||0,hearts:existing?.hearts||0};const file=document.getElementById('modelPhoto').files[0];const commit=()=>{if(existing){data.models=data.models.map(x=>x.id===m.id?m:x)}else data.models.unshift(m);save();closeBoardModal();renderAll();toast(existing?'Модель обновлена':'Новая доска добавлена!')};if(file)readImage(file,photo=>{m.photo=photo;commit()});else commit()};\n document.querySelectorAll('.side-link').forEach(btn=>btn.onclick=()=>switchPanel(btn.dataset.panel));document.querySelectorAll('[data-board-filter]').forEach(btn=>btn.onclick=()=>{boardFilter=btn.dataset.boardFilter;document.querySelectorAll('[data-board-filter]').forEach(x=>x.classList.toggle('active',x===btn));renderAll()});document.getElementById('chatForm').onsubmit=e=>{e.preventDefault();const txt=document.getElementById('chatInput').value.trim();if(!txt)return;data.chat[chatPerson]??=[{me:false,text:'Здравствуйте! Буду рад обсудить детали заказа.'}];data.chat[chatPerson].push({me:true,text:txt});save();document.getElementById('chatInput').value='';openChat(chatPerson);document.getElementById('chatLog').scrollTop=9999};document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeBoardModal();document.getElementById('chatOverlay').classList.remove('open')}});}\nfunction hydrate(){const p=data.profile||{};for(const [name,value] of Object.entries(p)){const field=document.querySelector(`#shaperForm [name=\"${name}\"]`);if(field&&typeof value==='string')field.value=value;}document.getElementById('aboutLength').textContent=(p.about||'').length;for(const box of document.querySelectorAll('#materials input'))box.checked=(p.materials||['Стекловолокно','Карбон']).includes(box.value);for(const box of document.querySelectorAll('input[name=\"delivery\"]'))box.checked=(p.delivery||['Самовывоз','Транспортная компания']).includes(box.value);document.getElementById('customOrders').checked=p.customOrders??true;document.getElementById('rentalService').checked=p.rentalService??false;const ava=localStorage.getItem(FKEY);if(ava)document.querySelectorAll('.user-avatar').forEach(img=>img.src=ava)}\n/* Дополнительная бизнес-логика прототипа: формы, каталог, заявки и массовое редактирование */\nlet catalogView='all', selectedOrder=null, activeChatOrder=null;\nconst otherShapers=[\n{id:'k-1',name:'Volna Craft',region:'Приморский край',models:[{id:'e11',name:'Ocean Soul',type:'Лонгборд',price:79000,length:'9’0”',volume:62,status:'В наличии',board:0},{id:'e12',name:'Marea Fish',type:'Фиш',price:61000,length:'5’7”',volume:35,status:'Под заказ',board:4}]},\n{id:'k-2',name:'Baltic Surf Lab',region:'Калининградская область',models:[{id:'e21',name:'Baltic Blue',type:'Шортборд',price:67500,length:'6’2”',volume:34,status:'В наличии',board:2},{id:'e22',name:'White Coast',type:'Фанборд',price:72000,length:'7’4”',volume:49,status:'Под заказ',board:3}]},\n{id:'k-3',name:'Сахалинские доски',region:'Сахалинская область',models:[{id:'e31',name:'North Point',type:'SUP',price:93000,length:'10’0”',volume:160,status:'В наличии',board:4}]}\n];\nfunction allOffers(){const own={id:'self',name:data.profile?.workshop||'Kamchatka Boards',region:data.profile?.region||'Камчатский край',models:data.models};return [own,...otherShapers].flatMap(sh=>sh.models.map(m=>({...m,ownerId:sh.id,ownerName:sh.name,region:sh.region})));}\nfunction imgFor(m){return m.photo||IMG.boards[Number.isFinite(Number(m.board))?Math.abs(Number(m.board))%IMG.boards.length:0]||IMG.boards[0];}\nfunction phoneMask(raw){let digits=String(raw||'').replace(/\\D/g,'');if(!digits)return '';if(digits[0]==='8'||digits[0]==='7')digits=digits.slice(1);digits=digits.slice(0,10);let out='+7';if(digits.length)out+=' '+digits.slice(0,3);if(digits.length>3)out+=' '+digits.slice(3,6);if(digits.length>6)out+=' '+digits.slice(6,8);if(digits.length>8)out+=' '+digits.slice(8,10);return out;}\nfunction showPage(page){document.querySelectorAll('.pane').forEach(x=>x.classList.toggle('active',x.id===page));if(page==='dashboard'){updateProfile();renderAll()}if(page==='catalog')renderCatalog();if(page==='registration'){const btn=document.getElementById('profileSaveButton');btn.textContent=data.profile?.workshop?'Сохранить изменения':'Зарегистрироваться как шейпер';}window.scrollTo({top:0,behavior:'smooth'});document.getElementById('mobileNav')?.classList.remove('open');}\nfunction openBoardModal(id){editingId=id||null;document.getElementById('modalTitle').textContent=id?'Редактировать модель доски':'Добавить новую доску';document.getElementById('boardForm').reset();const preview=document.getElementById('modelPhotoPreview');preview.hidden=true;preview.removeAttribute('src');document.getElementById('modelPhotoName').textContent='Фото ещё не выбрано';if(id){const m=data.models.find(x=>x.id===id);if(m){for(const [key,field] of Object.entries({name:'modelName',type:'modelType',length:'modelLength',dimensions:'modelDimensions',volume:'modelVolume',price:'modelPrice',status:'modelStatus',material:'modelMaterial',description:'modelDescription'})){document.getElementById(field).value=m[key]||''}if(m.photo){preview.src=m.photo;preview.hidden=false;document.getElementById('modelPhotoName').textContent='Текущее фото модели — можно заменить';}}}document.getElementById('boardOverlay').classList.add('open');}\nfunction modelCard(m){const cls=m.status==='В наличии'?'available':m.status==='Под заказ'?'made':'none', photo=imgFor(m);return `\u003Carticle class=\"model\">\u003Cdiv class=\"model-visual\">\u003Cimg src=\"${photo}\" alt=\"Доска ${escapeHtml(m.name)}\" loading=\"lazy\">\u003Cspan class=\"status ${cls}\">${escapeHtml(m.status)}\u003C/span>\u003Cbutton class=\"model-menu\" type=\"button\" data-edit=\"${m.id}\" aria-label=\"Изменить ${escapeHtml(m.name)}\">${icons('more')}\u003C/button>\u003C/div>\u003Cdiv class=\"model-info\">\u003Cstrong>${escapeHtml(m.name)}\u003C/strong>\u003Cdiv class=\"model-type\">${escapeHtml(m.type)}\u003C/div>\u003Cspan class=\"model-param\">♧ ${escapeHtml(m.length||'—')} · ${escapeHtml(m.dimensions||'—')}\u003C/span>\u003Cspan class=\"model-param\">♧ ${escapeHtml(m.volume||'—')} л\u003C/span>\u003Cdiv class=\"model-price\">${money(m.price)}\u003C/div>\u003Cdiv class=\"model-foot\">\u003Cspan>${icons('views')} ${m.views||0}\u003C/span>\u003Cspan>${icons('heart')} ${m.hearts||0}\u003C/span>\u003C/div>\u003C/div>\u003C/article>`;}\nfunction orderMeta(r){let price=r.amount?` · ${money(r.amount)}`:'';return `${escapeHtml(r.kind||'Запрос')} · ${escapeHtml(r.title)}${price}`;}\nfunction statusClass(s){return s==='Завершена'?'status-done':['Отклонена','Отменена'].includes(s)?'status-cancel':s==='В работе'?'pending':'';}\nfunction controlButtons(r,mode){const pending=r.status==='Новая',working=r.status==='В работе',closed=['Завершена','Отменена','Отклонена'].includes(r.status);if(closed)return '';if(mode==='owner')return `\u003Cdiv class=\"order-actions\">${pending?`\u003Cbutton class=\"btn-good\" type=\"button\" data-order-action=\"accept\" data-order-id=\"${r.id}\">Принять\u003C/button>`:''}${working?`\u003Cbutton class=\"btn-good\" type=\"button\" data-order-action=\"finish\" data-order-id=\"${r.id}\">Завершить\u003C/button>`:''}\u003Cbutton class=\"btn-danger\" type=\"button\" data-order-action=\"decline\" data-order-id=\"${r.id}\">Отказаться\u003C/button>\u003Cbutton class=\"btn-soft\" type=\"button\" data-order-action=\"chat\" data-order-id=\"${r.id}\">Чат\u003C/button>\u003C/div>`;return `\u003Cdiv class=\"order-actions\">\u003Cbutton class=\"btn-soft\" type=\"button\" data-order-action=\"chat\" data-order-id=\"${r.id}\">Чат\u003C/button>\u003Cbutton class=\"btn-danger\" type=\"button\" data-order-action=\"cancel\" data-order-id=\"${r.id}\">Отменить заявку\u003C/button>\u003C/div>`;}\nfunction requestMarkup(r){return `\u003Cdiv class=\"request-item\">\u003Cimg class=\"mini-avatar\" src=\"${IMG.avatar}\" alt=\"\">\u003Cdiv class=\"request-copy order-copy\">\u003Cstrong>${escapeHtml(r.name||'Участник')}\u003C/strong>\u003Csmall>${orderMeta(r)}\u003C/small>\u003Csmall>${escapeHtml(r.text||'')}\u003C/small>\u003C/div>\u003Cdiv class=\"request-meta\">\u003Csmall class=\"request-date\">${escapeHtml(r.ago||'Сейчас')}\u003C/small>\u003Cspan class=\"badge ${statusClass(r.status)}\">${escapeHtml(r.status)}\u003C/span>\u003C/div>${controlButtons(r,'owner')}\u003C/div>`;}\nfunction renderStatistics(){const finished=(data.requests||[]).filter(r=>r.status==='Завершена');const sold=finished.filter(r=>(r.kind||'Покупка')==='Покупка').length;const rented=finished.filter(r=>r.kind==='Аренда').length;const revenue=finished.reduce((sum,r)=>sum+Number(r.amount||0),0);document.getElementById('soldCount').textContent=sold;document.getElementById('rentCount').textContent=rented;document.getElementById('revenueCount').textContent=money(revenue);document.getElementById('statCopy').textContent=`Продано досок: ${sold} · Арендовано: ${rented} · Выручка: ${money(revenue)}. Показатели только из завершённых демонстрационных заказов; расходы не учтены.`;}\nfunction renderBulk(){const body=document.getElementById('bulkBody');if(!body)return;body.innerHTML=data.models.map(m=>`\u003Ctr data-id=\"${m.id}\"> }\" ${b.photoIds?.[0]?`data-media-id=\"${h(b.photoIds[0])}\"`:''}>\u003C/button>\u003Cstrong>${h(b.name)}\u003C/strong>\u003Csmall>${h(b.type)} · ${h(b.length||'размер уточняется')}${b.volume?' · '+h(b.volume)+' л':''}\u003C/small>\u003Cdiv class=\"gv-profile-price\">${money(b.price)}\u003C/div>\u003Cbutton class=\"primary\" type=\"button\" data-gv-order=\"${h(b.ownerId)}\" data-model=\"${h(b.id)}\" ${m.id==='self'&&data.profile?.workshop?'disabled':''}>${m.id==='self'&&data.profile?.workshop?'Ваша доска':'Оставить заявку'}\u003C/button>\u003C/article>`).join('')||'\u003Cp class=\"form-help\">Модели пока не добавлены.\u003C/p>';\n}\nfunction openMaker(id){\n const m=maker(id);if(!m)return toast('Профиль шейпера не найден');\n $('gvShaperTitle').textContent=m.name;\n const yesno=(cond,whenTrue)=>cond?`\u003Cspan class=\"gv-profile-chip\">${whenTrue}\u003C/span>`:'';\n $('gvShaperContent').innerHTML=`\u003Caside class=\"gv-profile-aside\">${avatar(m)}\u003Ch3>${h(m.person)}\u003C/h3>\u003Cdiv class=\"gv-region\">${h(m.region)}${m.city?' · '+h(m.city):''}\u003C/div>\n \u003Cdiv class=\"gv-profile-smalltitle\">Специализация\u003C/div>\u003Cdiv class=\"gv-profile-chips\">${m.types.length?m.types.map(t=>`\u003Cspan class=\"gv-profile-chip\">${h(t)}\u003C/span>`).join(''):'\u003Cspan class=\"muted\">Не указана\u003C/span>'}\u003C/div>\n \u003Cdiv class=\"gv-profile-smalltitle\">Услуги\u003C/div>\u003Cdiv class=\"gv-profile-chips\">${yesno(m.customOrders,'Индивидуальные заказы')}${yesno(m.repairService,'Ремонт досок')}${yesno(m.rentalService,'Аренда')}${!m.customOrders&&!m.repairService&&!m.rentalService?'\u003Cspan class=\"muted\">Создание моделей досок\u003C/span>':''}\u003C/div>\n \u003Cdiv class=\"gv-profile-smalltitle\">Материалы\u003C/div>\u003Cdiv class=\"gv-profile-chips\">${m.materials.length?m.materials.map(t=>`\u003Cspan class=\"gv-profile-chip\">${h(t)}\u003C/span>`).join(''):'\u003Cspan class=\"muted\">Уточняйте у мастера\u003C/span>'}\u003C/div>\n ${m.phone||m.email||m.telegram?`\u003Cdiv class=\"gv-profile-smalltitle\">Контакты\u003C/div>\u003Cp class=\"gv-profile-contact\">${[m.phone,m.email,m.telegram].filter(Boolean).map(x=>h(x)).join('\u003Cbr>')}\u003C/p>`:''}\n ${m.demo?'\u003Cp class=\"form-help\">Демонстрационный профиль\u003C/p>':''}\n \u003Cdiv class=\"gv-profile-actions\">${m.id==='self'&&data.profile?.workshop?'\u003Cbutton type=\"button\" class=\"secondary\" disabled title=\"Нельзя писать самому себе\">Это ваша мастерская\u003C/button>':`\u003Cbutton type=\"button\" class=\"primary\" data-gv-message=\"${h(m.id)}\">Написать шейперу\u003C/button>`}${m.promoVideoId?`\u003Cbutton type=\"button\" class=\"secondary\" data-gv-promo=\"${h(m.id)}\">▶ Промо-видео\u003C/button>`:''}\u003C/div>\u003C/aside>\n \u003Cdiv class=\"gv-profile-details\">\u003Cp class=\"gv-profile-description\">${h(m.about)}\u003C/p>\u003Cdiv class=\"gv-profile-facts\">\u003Cdiv class=\"gv-profile-fact\">\u003Csmall>Опыт шейпинга\u003C/small>\u003Cstrong>${h(m.experience)}\u003C/strong>\u003C/div>\u003Cdiv class=\"gv-profile-fact\">\u003Csmall>Срок изготовления\u003C/small>\u003Cstrong>${h(m.leadTime)}\u003C/strong>\u003C/div>\u003Cdiv class=\"gv-profile-fact\">\u003Csmall>Доставка\u003C/small>\u003Cstrong>${h(m.delivery.slice(0,2).join(', ')||'По договорённости')}\u003C/strong>\u003C/div>\u003C/div>\u003Chr class=\"gv-profile-divider\">\u003Cdiv class=\"section-head\">\u003Ch3>Модели мастерской\u003C/h3>\u003Cspan class=\"muted\">${m.models.length} моделей\u003C/span>\u003C/div>\u003Cdiv class=\"gv-profile-models\">${modelTiles(m)}\u003C/div>\u003C/div>`;\n $('gvShaperOverlay').classList.add('open');\n}\nfunction closeMaker(){$('gvShaperOverlay').classList.remove('open')}\nfunction findBoard(id,ownerId){return allOffers().find(x=>String(x.id)===String(id)&&String(x.ownerId)===String(ownerId));}\n// Prior wrappers still handle existing all-board rendering, gallery and local media.\nconst previousCatalog=renderCatalog;\nrenderCatalog=function(){\n previousCatalog();\n const query=($('catalogQuery')?.value||'').trim().toLowerCase(), type=$('catalogType')?.value||'';\n const makers=shaperIDs().map(maker).filter(Boolean).filter(m=>{\n   const matching=m.models.filter(b=>!type||b.type===type);\n   const qmatch=!query||[m.name,m.person,m.region,m.city,m.about,...m.types,...matching.flatMap(x=>[x.name,x.type])].join(' ').toLowerCase().includes(query);\n   return qmatch&&(!type||matching.length>0);\n });\n $('catalogMakers').innerHTML=makers.map(makerCard).join('')||'\u003Cdiv class=\"empty-state\">По вашему запросу мастерские не найдены.\u003C/div>';\n if(catalogView==='makers'){$('catalogHeading').textContent='Шейперы и их мастерские';$('catalogCount').textContent=`Найдено ${makers.length} мастерских`;}\n $('catalogBoards').querySelectorAll('.model-info').forEach(info=>{\n   const text=info.querySelector('.model-owner'); if(!text||info.querySelector('.gv-maker-link'))return;\n   const el=info.closest('.model'); const btn=el?.querySelector('[data-buy]');if(!btn)return;\n   const link=document.createElement('button');link.type='button';link.className='gv-maker-link';link.dataset.gvMaker=btn.dataset.owner;link.innerHTML=`${icons('user','ic-sm')} О шейпере →`;\n   text.insertAdjacentElement('afterend',link);\n });\n};\nconst demoInbox=[\n {id:'in-alexey',person:'Алексей Смирнов',preview:'Здравствуйте! Интересует изготовление шортборда...',unread:2,messages:['Здравствуйте! Интересует изготовление шортборда под мой рост.','Можно ли подобрать объём и обсудить сроки?']},\n {id:'in-maria',person:'Мария Ковалёва',preview:'Какая цена за модель Volcano?',unread:1,messages:['Здравствуйте! Какая цена за модель Volcano?']}\n];\nfunction ensureInbox(){\n if(!Array.isArray(data.inbox))data.inbox=demoInbox.map(o=>({...o}));\n for(const item of data.inbox){\n   if(!Array.isArray(item.messages))item.messages=[item.preview];\n   if(!Array.isArray(data.chat[item.person]))data.chat[item.person]=item.messages.map(text=>({me:false,text}));\n }\n save();\n}\nfunction renderInbox(){\n const unread=data.inbox.reduce((sum,x)=>sum+(Number(x.unread)||0),0);\n $('gvInboxList').innerHTML=data.inbox.map((x,i)=>`\u003Cbutton type=\"button\" class=\"gv-inbox-row${x.unread?' is-unread':''}\" data-gv-inbox=\"${h(x.id)}\">\u003Cimg class=\"mini-avatar\" alt=\"\" src=\"${h(IMG.avatar)}\">\u003Cspan class=\"request-copy\">\u003Cstrong>${h(x.person)}\u003C/strong>\u003Csmall>${h(x.preview)}\u003C/small>\u003C/span>\u003Cspan class=\"gv-inbox-status\">${x.unread?x.unread+' новых':'Прочитано'}\u003C/span>\u003C/button>`).join('')||'\u003Cp class=\"muted\">Входящих пока нет.\u003C/p>';\n $('inboxSummary').textContent=unread?`Непрочитанных сообщений: ${unread}`:'Все сообщения прочитаны';\n $('messageNavCount').textContent=unread||'';\n}\nconst previousChat=openChat;\nopenChat=function(person,id){\n const incoming=data.inbox.find(x=>x.person===person);\n if(incoming&&incoming.unread){incoming.unread=0;save();renderInbox();}\n previousChat(person,id);\n const log=$('chatLog');\n if(log){\n   const intro=document.createElement('div');intro.className='gv-chat-intro';intro.setAttribute('aria-label','Начало переписки');\n   intro.innerHTML=`\u003Cdiv class=\"gv-chat-intro-icon\">${icons('mail','ic-lg')}\u003C/div>\u003Cstrong>Начало диалога\u003C/strong>\u003Csmall>Обсудите форму доски, её размеры и сроки изготовления.\u003Cbr>Переписка работает в демонстрационном режиме.\u003C/small>\u003Cdiv class=\"gv-chat-intro-mark\">СООБЩЕНИЯ\u003C/div>`;\n   const spacer=document.createElement('div');spacer.className='gv-chat-fill';spacer.setAttribute('aria-hidden','true');\n   log.prepend(intro,spacer);\n   log.scrollTop=log.scrollHeight;\n }\n};\nconst previousRenderAll=renderAll;\nrenderAll=function(){previousRenderAll();renderInbox();$('outgoingNavCount').textContent=(data.outgoing||[]).length||'';};\nfunction init(){\n ensureInbox();\n // Reuse the owner's public profile preview and route only through a modal.\n const selfButton=document.querySelector('.public-btn');if(selfButton)selfButton.onclick=()=>openMaker('self');\n document.addEventListener('click',event=>{\n   const profile=event.target.closest('[data-gv-maker]');if(profile){event.preventDefault();openMaker(profile.dataset.gvMaker);return;}\n   const preview=event.target.closest('[data-gv-board-preview]');if(preview){event.preventDefault();const board=findBoard(preview.dataset.model,preview.dataset.gvBoardPreview);if(board)window.GVOpenBoardViewer?.(board);return;}\n   const order=event.target.closest('[data-gv-order]');if(order){event.preventDefault();closeMaker();openOrderModal(order.dataset.model,order.dataset.gvOrder);return;}\n   const promo=event.target.closest('[data-gv-promo]');if(promo){event.preventDefault();window.GVShowPromo?.();return;}\n   const inbox=event.target.closest('[data-gv-inbox]');if(inbox){event.preventDefault();const x=data.inbox.find(z=>z.id===inbox.dataset.gvInbox);if(x)openChat(x.person);return;}\n   const msg=event.target.closest('[data-gv-message]');if(msg){event.preventDefault();const m=maker(msg.dataset.gvMessage);if(m){if(m.id==='self'&&data.profile?.workshop){toast('Нельзя написать самому себе');return;}closeMaker();openChat(m.name);}return;}\n });\n $('gvShaperClose').addEventListener('click',closeMaker);\n $('gvShaperOverlay').addEventListener('click',event=>{if(event.target===$('gvShaperOverlay'))closeMaker()});\n document.addEventListener('keydown',event=>{if(event.key==='Escape')closeMaker()});\n renderAll();\n}\ninit();\n})();\n\n\u003C/script>\n\u003Cscript>\n/* GV v4 — обращения, рабочая панель, статистика, карусель мастерских. */\n(()=>{\n'use strict';\nconst $=id=>document.getElementById(id);\nconst esc=escapeHtml;\n// Fallback images follow the actual type silhouette, but uploaded photographs always win.\nimgFor=function(m){if(m.photo)return m.photo;return window.GVShapeData?.(m.type)||IMG.boards[0]};\nconst storedChat=()=>data.chat|| (data.chat={});\nconst orderKey=r=>'order-'+r.id;\nconst isClosed=s=>['Завершена','Отклонена','Отменена'].includes(s);\nconst allRequests=()=>data.requests||[];\nconst contactKey='gv-contact-tab';\nlet currentContact='requests';\nfunction setContactTab(to){\n currentContact=to==='chats'?'chats':'requests';\n $('gvContactRequestsBody').hidden=currentContact!=='requests';\n $('gvContactChatsBody').hidden=currentContact!=='chats';\n for(const btn of document.querySelectorAll('[data-gv-contact-tab]')){\n   const on=btn.dataset.gvContactTab===currentContact;\n   btn.classList.toggle('active',on);btn.setAttribute('aria-selected',String(on));\n }\n}\n// Each application is a thread, and the action to open chat becomes available once accepted.\ncontrolButtons=function(r,mode){\n const fresh=r.status==='Новая',work=r.status==='В работе',closed=isClosed(r.status);\n const readonly=mode!=='owner';\n const chat=`\u003Cbutton type=\"button\" class=\"gv-request-chat\" data-order-action=\"chat\" data-order-id=\"${esc(r.id)}\" ${r.status==='Отклонена'||r.status==='Отменена'?'disabled title=\"Чат недоступен после отмены или отказа\"':''}>${icons('mail','ic-sm')} Перейти в чат\u003C/button>`;\n if(readonly){return `\u003Cdiv class=\"order-actions\">${chat}${!closed?`\u003Cbutton class=\"btn-danger\" type=\"button\" data-order-action=\"cancel\" data-order-id=\"${esc(r.id)}\">Отменить\u003C/button>`:''}\u003C/div>`}\n return `\u003Cdiv class=\"order-actions\">${fresh?`\u003Cbutton class=\"btn-good\" type=\"button\" data-order-action=\"accept\" data-order-id=\"${esc(r.id)}\">Принять в работу\u003C/button>`:''}${work?`\u003Cbutton class=\"btn-good\" type=\"button\" data-order-action=\"finish\" data-order-id=\"${esc(r.id)}\">Завершить\u003C/button>`:''}${!closed?`\u003Cbutton class=\"btn-danger\" type=\"button\" data-order-action=\"decline\" data-order-id=\"${esc(r.id)}\">Отказать\u003C/button>`:''}${chat}\u003C/div>`;\n};\nconst baseUpdateOrder=updateOrder;\nupdateOrder=function(id,action){\n const target=findOrder(id);\n if(!target)return;\n // The client may initiate or continue chatting while the request is new.\n if(action==='chat'&&['Отклонена','Отменена'].includes(target.status)){toast('По отклонённой или отменённой заявке чат недоступен');return;}\n const previous=target.status;\n baseUpdateOrder(id,action);\n if(action==='accept'&&target.status==='В работе'&&previous==='Новая'){\n   if(!Array.isArray(storedChat()[orderKey(target)]))storedChat()[orderKey(target)]=[{me:false,text:target.text||'Хочу уточнить детали заказа'}];\n   save();\n   openChat(target.name||'Клиент',target.id);\n }\n};\nconst existingChat=openChat;\nopenChat=function(person,id){\n const p=data.profile||{};\n const selfName=p.workshop||'Kamchatka Boards';\n if(p.workshop&&person===selfName&&!id){toast('Шейпер не может писать самому себе');return;}\n const order=id?findOrder(id):null;\n // Chat is available before acceptance; acceptance still changes the request status.\n if(order&&['Отменена','Отклонена'].includes(order.status)){toast('Чат недоступен для этой заявки');return;}\n if(order&&!storedChat()[orderKey(order)]){\n   storedChat()[orderKey(order)]=[{me:false,text:order.text||'Здравствуйте! Интересует эта модель.'}];\n   save();\n }\n existingChat(person,id);\n const incoming=(data.inbox||[]).find(x=>x.person===person);\n if(incoming?.unread){incoming.unread=0;save();}\n refreshBadges();\n};\n// Compose messages for both order-linked threads and ordinary inbox conversations.\n$('chatForm').onsubmit=e=>{\n e.preventDefault();const input=$('chatInput'),text=input.value.trim();if(!text)return;\n const k=activeChatOrder?orderKey(activeChatOrder):chatPerson;\n if(!k)return;\n const ownName=data.profile?.workshop||'Kamchatka Boards';\n if(!activeChatOrder&&chatPerson===ownName&&data.profile?.workshop){toast('Нельзя отправить сообщение самому себе');return;}\n const msgs=storedChat();msgs[k]??=[];msgs[k].push({me:true,text,at:Date.now()});\n const inbox=(data.inbox||[]).find(x=>x.person===chatPerson);\n if(inbox){inbox.preview=text;inbox.unread=0;}\n save();input.value='';openChat(chatPerson,activeChatOrder?.id);$('chatLog').scrollTop=999999;\n};\n// View helpers: every figure is calculated from the local collection.\nfunction metrics(){\n const requests=allRequests(),done=requests.filter(r=>r.status==='Завершена'),active=requests.filter(r=>r.status==='В работе'),fresh=requests.filter(r=>r.status==='Новая');\n const gross=done.reduce((sum,r)=>sum+(Number(r.amount)||0),0);\n const unique=new Set(requests.map(r=>r.contact||r.name).filter(Boolean)).size;\n const value=Math.round(done.length?gross/done.length:0);\n const types=new Map();data.models.forEach(m=>types.set(m.type,(types.get(m.type)||0)+1));\n const views=data.models.reduce((sum,m)=>sum+(Number(m.views)||0),0);\n const favorites=data.models.reduce((sum,m)=>sum+(Number(m.hearts)||0),0);\n const rate=requests.length?Math.round(done.length/requests.length*100):0;\n return {total:requests.length,done:done.length,active:active.length,fresh:fresh.length,gross,unique,value,types,views,favorites,rate,models:data.models.length};\n}\nconst num=x=>Number(x||0).toLocaleString('ru-RU');\nfunction statTile(title,value,note){return `\u003Cdiv class=\"gv-stat-tile\">\u003Csmall>${esc(title)}\u003C/small>\u003Cstrong>${esc(value)}\u003C/strong>\u003Cspan class=\"gv-stat-detail-note\">${esc(note)}\u003C/span>\u003C/div>`;}\nfunction statBar(title,n,max){return `\u003Cdiv class=\"gv-bar-line\">\u003Cspan>${esc(title)}\u003C/span>\u003Cstrong>${num(n)}\u003C/strong>\u003C/div>\u003Cdiv class=\"gv-bar-track\">\u003Cdiv class=\"gv-bar-fill\" style=\"width:${max>0?Math.round(n/max*100):0}%\">\u003C/div>\u003C/div>`;}\nfunction renderMetrics(){\n const m=metrics();\n $('gvSummaryViews').textContent=num(m.views);$('gvSummaryFinished').textContent=num(m.done);\n $('gvOverviewMetrics').innerHTML=[['Новых заявок',m.fresh],['В работе',m.active],['Завершено',m.done],['Выручка, ₽',num(m.gross)]].map(([label,value])=>`\u003Cdiv class=\"gv-mini-kpi\">\u00 r('input',refreshArticlePreview);el.addEventListener('change',refreshArticlePreview);\n }\n const previousModal=openBoardModal;\n openBoardModal=function(...args){previousModal(...args);refreshArticlePreview()};\n // Boards of demonstration workshops also receive articles from exactly the same pattern.\n const samples={'k-1':'VLC01','k-2':'BSL02','k-3':'KSP03'};\n for(const sh of otherShapers){\n   const code=samples[sh.id]||'D'+sh.id.replace(/[^a-zA-Z\\d]/g,'').toUpperCase().slice(0,5);\n   sh.models.forEach((m,i)=>{m.articleSeq=i+1;m.article=window.GVArticles.make(m,m.articleSeq,code)});\n }\n renderAll();\n})();\n\u003C/script>\u003C/body>\u003C/html>\n"</script>
