   editModal(id?'Редактирование программы':'Новая программа',field('name','Название программы',x.name,true?'text':'text',true)+`<div class="gv-ac-fields">${field('duration','Продолжительность',x.duration||'90 минут')}${field('price','Стоимость, ₽',x.price||'', 'number')}</div><label>Для какого уровня<select name="level">${['Начинающий','Средний','Продвинутый','Любой уровень'].map(v=>`<option ${x.level===v?'selected':''}>${v}</option>`).join('')}</select></label><label>Описание<textarea name="description" maxlength="600">${safe(x.description||'')}</textarea></label>`,'gvSchoolProgramForm',id?`<div class="gv-ac-form-action"><button class="gv-ac-btn danger" type="button" data-gv-delete="program:${safe(id)}">Удалить программу</button></div>`:'');
  }else if(type==='session'){
   schoolEditSession=id;const x=s.sessions.find(z=>z.id===id)||{};
   editModal(id?'Изменить занятие':'Добавить занятие',`<label>Программа<select name="programId" required>${s.programs.map(p=>`<option value="${safe(p.id)}" ${x.programId===p.id?'selected':''}>${safe(p.name)}</option>`).join('')}</select></label><div class="gv-ac-fields">${field('date','Дата',x.date||new Date().toISOString().slice(0,10),'date',true)}${field('time','Время',x.time||'10:00','time',true)}</div><div class="gv-ac-fields">${field('spot','Спот',x.spot||s.spot)}${field('capacity','Количество мест',x.capacity||'5','number',true)}</div><label>Инструктор<select name="coach"><option value="">Пока не назначен</option>${s.members.map(m=>`<option ${x.coach===m.name?'selected':''}>${safe(m.name)}</option>`).join('')}</select></label>`,'gvSchoolSessionForm',id?`<button class="gv-ac-btn danger" data-gv-delete="session:${safe(id)}" type="button">Удалить занятие</button>`:'');
  }else if(type==='student'){
   editModal('Новая запись ученика',`${field('name','Имя ученика','', 'text',true)}${field('contact','Контакт')}<label>Программа<select name="programId"><option value="">Выберите</option>${s.programs.map(p=>`<option value="${safe(p.id)}">${safe(p.name)}</option>`).join('')}</select></label>`,'gvSchoolStudentForm','<p class="gv-ac-muted">В демоверсии запись добавляется вручную. Клиент ещё не получает уведомления.</p>');
  }else if(type==='member'){
   schoolEditMember=id;const x=s.members.find(z=>z.id===id)||{};
   editModal(id?'Изменить сотрудника':'Добавить сотрудника',field('name','Имя сотрудника',x.name,'text',true)+field('contact','Email или телефон',x.contact)+`<label>Роль в школе<select name="role">${['Инструктор','Администратор расписания','Менеджер','Владелец'].map(v=>`<option ${x.role===v?'selected':''}>${v}</option>`).join('')}</select></label>`,'gvSchoolMemberForm',id?`<button class="gv-ac-btn danger" type="button" data-gv-delete="member:${safe(id)}">Удалить из списка</button>`:'');
  }
 }
 function saveEntity(e,type){e.preventDefault();e.stopImmediatePropagation();const form=e.target,fd=new FormData(form),s=school(),id=String(Date.now())+'_'+Math.random().toString(36).slice(2,6);
  if(type==='program'){
   const price=Number(fd.get('price'));if(!Number.isFinite(price)||price<0){toast('Проверьте стоимость');return}
   const x={id:schoolEditProgram||id,name:getFD(form,'name').slice(0,100),duration:getFD(form,'duration').slice(0,70),price,level:getFD(form,'level'),description:getFD(form,'description').slice(0,600)};
   const i=s.programs.findIndex(p=>p.id===x.id);if(i>=0)s.programs[i]=x;else s.programs.push(x);
  }else if(type==='session'){
   const date=getFD(form,'date'),capacity=Number(fd.get('capacity'));if(capacity<1||capacity>500){toast('Укажите число мест от 1 до 500');return}
   const x={id:schoolEditSession||id,programId:getFD(form,'programId'),date,time:getFD(form,'time'),spot:getFD(form,'spot'),capacity,coach:getFD(form,'coach')};
   const i=s.sessions.findIndex(p=>p.id===x.id);if(i>=0)s.sessions[i]=x;else s.sessions.push(x);
  }else if(type==='student')s.students.push({id,name:getFD(form,'name'),contact:getFD(form,'contact'),programId:getFD(form,'programId'),status:'Новая'});
  else if(type==='member'){
   const x={id:schoolEditMember||id,name:getFD(form,'name'),contact:getFD(form,'contact'),role:getFD(form,'role')};const i=s.members.findIndex(p=>p.id===x.id);if(i>=0)s.members[i]=x;else s.members.push(x);
  }
  saveSchool(s);closeModal();toast('Сохранено в кабинете школы');update();
 }
 document.addEventListener('click',function(e){
  const el=e.target.closest('[data-gv-pane],[data-gv-toggle],[data-gv-setting],[data-gv-school],[data-gv-create],[data-gv-editprogram],[data-gv-editsession],[data-gv-editmember],[data-gv-studentstate],[data-gv-preview],[data-gv-delete],[data-gv-diardy],[data-gv-cancel]');
  if(!el)return;e.preventDefault();e.stopImmediatePropagation();
  if(el.hasAttribute('data-gv-pane')){pane=el.dataset.gvPane;update();return}
  if(el.hasAttribute('data-gv-school')){pane='school';schoolPane=el.dataset.gvSchool;update();return}
  if(el.hasAttribute('data-gv-toggle')){const id=el.dataset.gvToggle,a=rset();user.roles=a.includes(id)?a.filter(x=>x!==id):[...a,id];if(id==='rental')user.rent=user.roles.includes('rental');store('gg_user',user);if(!user.roles.includes(pane))pane='directions';update();toast(user.roles.includes(id)?'Направление добавлено':'Направление скрыто');return}
  if(el.hasAttribute('data-gv-setting')){const id=el.dataset.gvSetting;user[id]=!user[id];store('gg_user',user);update();return}
  if(el.hasAttribute('data-gv-create')){createEntity(el.dataset.gvCreate);return}
  for(const [attr,type] of [['data-gv-editprogram','program'],['data-gv-editsession','session'],['data-gv-editmember','member']])if(el.hasAttribute(attr)){createEntity(type,el.getAttribute(attr));return}
  if(el.hasAttribute('data-gv-delete')){const [typ,id]=el.dataset.gvDelete;if(!confirm('Удалить эту запись из локального кабинета?'))return;const s=school(),key=({program:'programs',session:'sessions',member:'members'})[typ];if(!key)return;s[key]=s[key].filter(x=>x.id!==id);if(typ==='program')s.sessions=s.sessions.filter(x=>x.programId!==id);saveSchool(s);closeModal();update();return}
  if(el.hasAttribute('data-gv-studentstate')){const s=school(),x=s.students.find(z=>z.id===el.dataset.gvStudentstate);if(!x)return;const a=['Новая','Подтверждена','Завершено','Отменена'];x.status=a[(a.indexOf(x.status)+1)%a.length];saveSchool(s);update();return}
  if(el.hasAttribute('data-gv-diardy')){const id=el.dataset.gvDiardy;if(!confirm('Удалить запись о катании?'))return;saveDiary(diary().filter(x=>x.id!==id));update();return}
  if(el.hasAttribute('data-gv-preview')){const s=school();openModal(`<h2>${safe(s.name||'Моя сёрф-школа')}</h2><div class="gv-ac-preview"><span class="gv-ac-kicker">Карточка школы · предварительный просмотр</span><h3 style="font-size:22px;color:#0773a1;margin:10px 0">${safe(s.name||'Название школы')}</h3><p>${safe(s.region)} · ${safe(s.spot)}</p><p>${safe(s.description||'Описание школы пока не заполнено.')}</p><p>${safe(s.programs.length)} программ обучения · ${safe(s.members.length)} сотрудников</p></div><p class="gv-ac-note">Карточка пока не опубликована для других пользователей.</p>`,true);return}
  if(el.hasAttribute('data-gv-cancel')){closeModal();return}
 },true);
 document.addEventListener('submit',function(e){
  const id=e.target.id;
  if(!['gvCommonProfile','gvDiaryForm','gvSchoolProfile','gvSchoolProgramForm','gvSchoolSessionForm','gvSchoolStudentForm','gvSchoolMemberForm'].includes(id))return;
  e.preventDefault();e.stopImmediatePropagation();const f=e.target;
  if(id==='gvCommonProfile'){
   user.name=getFD(f,'name').slice(0,90);user.region=getFD(f,'region');user.level=getFD(f,'level');user.board=getFD(f,'board');
   const photo=f.querySelector('input[name="avatar"]')?.files?.[0];
   const finish=()=>{store('gg_user',user);update();toast('Профиль сохранён')};
   if(photo){if(photo.size>1.5*1024*1024){toast('Фото не больше 1,5 МБ');return}if(!/^image\/(jpeg|png|webp)$/.test(photo.type)){toast('Нужен JPG, PNG или WebP');return}const fr=new FileReader();fr.onload=()=>{user.avatar=String(fr.result);finish()};fr.readAsDataURL(photo)}else finish();return;
  }
  if(id==='gvDiaryForm'){
    const date=getFD(f,'date'),spot=getFD(f,'spot'),notes=getFD(f,'notes');if(!date||!spot){toast('Укажите дату и спот');return}
    const a=diary();a.unshift({id:String(Date.now()),date,spot,notes:notes.slice(0,450)});saveDiary(a);update();toast('Выход на воду сохранён');return;
  }
  if(id==='gvSchoolProfile'){
   const s=school();s.name=getFD(f,'name').slice(0,100);s.region=getFD(f,'region');s.spot=getFD(f,'spot');s.contacts=getFD(f,'contacts');s.description=getFD(f,'description').slice(0,850);saveSchool(s);schoolPane='overview';update();toast('Карточка школы сохранена');return;
  }
  const types={gvSchoolProgramForm:'program',gvSchoolSessionForm:'session',gvSchoolStudentForm:'student',gvSchoolMemberForm:'member'};
  saveEntity(e,types[id]);
 },true);
 // Регистрация: основной сценарий прежний, дополнительные направления можно выбрать сразу.
 const oldShowRegister=window.showRegister;
 if(typeof oldShowRegister==='function')window.showRegister=function(){
  oldShowRegister();
  if(typeof regStep==='undefined'||regStep!==1)return;
  const target=document.querySelector('.role-list');if(!target)return;
  if(!Array.isArray(regData.extraRoles))regData.extraRoles=[];
  const extras=ROLES.filter(r=>r.id!==regData.role&&r.id!=='surfer'&&r.id!=='rental');
  target.insertAdjacentHTML('afterend',`<div class="gv-ac-reg-extra" style="margin:14px 0;padding:13px;background:#f1faff;border:1px solid #d7eaf5;border-radius:12px"><b style="color:#086990;font-size:12px">Дополнительные направления</b><p style="font-size:12px;color:#7696a8;margin:5px 0 10px">Можно выбрать несколько — они появятся в одном личном кабинете.</p><div style="display:flex;flex-wrap:wrap;gap:8px">${extras.map(r=>`<label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:12px;color:#267193;background:white;border:1px solid #cfe7f2;padding:8px;border-radius:9px"><input type="checkbox" data-gv-extra-reg="${r.id}" ${regData.extraRoles.includes(r.id)?'checked':''}>${r.icon} ${r.name}</label>`).join('')}</div></div>`);
 };
 const oldHandleRegister=window.handleRegister;
 if(typeof oldHandleRegister==='function')window.handleRegister=function(form){
  const extras=asArr(regData.extraRoles).filter(x=>ROLES.some(r=>r.id===x));
  oldHandleRegister(form);
  if(!user||modalKind==='register')return;
  user.roles=[...new Set([user.role||'surfer',...(user.rent?['rental']:[]),...extras])];
  store('gg_user',user);
  window.render();
 };
 document.addEventListener('change',e=>{const x=e.target.closest('[data-gv-extra-reg]');if(!x)return;regData.extraRoles=asArr(regData.extraRoles);if(x.checked)regData.extraRoles=[...new Set([...regData.extraRoles,x.dataset.gvExtraReg])];else regData.extraRoles=regData.extraRoles.filter(r=>r!==x.dataset.gvExtraReg)},true);
 // Add nav link only once to the existing header; preserve the original navigation and layout.
 try{
  const nav=document.getElementById('nav');if(nav&&!nav.querySelector('[data-go="profile"]'))nav.insertAdjacentHTML('beforeend','<button class="navlink" data-go="profile">Личный кабинет</button>');
  const mn=document.querySelector('.mobile-nav');if(mn&&!mn.querySelector('[data-go="profile"]'))mn.insertAdjacentHTML('beforeend','<button class="navlink" data-go="profile">Кабинет</button>');
 }catch(e){console.warn(e)}
 if(current==='profile'&&user)window.render();
})();
</script>
