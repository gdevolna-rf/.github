function home(){return hero('home','Гдеволна.рф —<br> где волна, там свои','Здесь находят любимые споты, знакомятся с людьми и открывают российский сёрфинг — от Камчатки и Сахалина до Крыма.','Найти свою волну','spots')+`<div class="wrap"><section class="section"><div class="home-columns"><div class="about-hero" style="--intro-photo:url('${img('intro')}')"><h2>◈ &nbsp; О сайте «Гдеволна.рф»</h2><p><b>Гдеволна.рф</b> — уютное место для тех, кто любит сёрфинг в России. Мы собираем вместе споты, инструкторов, мастеров досок и людей, которые понимают, зачем вставать на рассвете ради хорошей волны.</p><p>Наше дело — помогать находить друг друга. Даже если до ближайшего океана лететь полдня.</p><button class="pill-btn" data-go="club">Узнать о проекте &nbsp; →</button></div><div class="side-card"><h3>♧ &nbsp; Как пользоваться сайтом</h3>${['Выберите регион и найдите спот','Познакомьтесь с сёрферами и инструкторами','Забронируйте занятие или найдите компанию','Добавьте любимые места в избранное'].map((x,i)=>`<div class="step"><i>${i+1}</i><span>${x}</span></div>`).join('')}<button class="pill-btn" style="width:100%;margin-top:7px" data-go="gg">Знакомьтесь через GG Surfer →</button></div></div></section>

${wideBanner()}</div>`}
function wideBanner(){return `<div class="wide-banner" style="--mountain-photo:url('${img('hero_mountain')}')"><div><h2>Где волна — там жизнь</h2><p>Вулканы, снег, Ладога и горы Крыма. Открывайте для себя новые горизонты!</p><button class="pill-btn" data-go="spots">Перейти к карте спотов →</button></div></div>`}

function personCard(p){const saved=favorites.includes('person:'+p.id);const sample=(SAMPLE_REVIEWS[p.id]||[])[0];return `<article class="person-card"><div class="person-photo"><img src="${img(p.img)}" alt="Демонстрационное фото: ${p.name}" loading="lazy"><span class="region-on-photo">${regionTag(p.region)}</span><button class="like-btn ${saved?'active':''}" data-like="person:${p.id}" aria-label="В избранное">${saved?'♥':'♡'}</button></div><div class="person-body"><div class="person-name"><h3>${p.name}</h3>${ratingLine(p)}</div>${sample?`<button class="review-peek" data-action="reviews:${p.id}">«${esc(sample.text)}» <span>Все отзывы →</span></button>`:''}<div class="fieldline"><span class="sym">♧</span><div>Инструктор по сёрфингу ${p.cert?'<span class="tag verified" title="Значок квалификации — только в примере">✓ сертификат</span>':''}</div></div><div class="fieldline"><span class="sym">⌖</span><div><b>Споты</b>${esc(p.spots)}</div></div><div class="fieldline"><span class="sym">♧</span><div><b>Доски</b>${esc(p.board)}</div></div><div class="tiny-cols"><div class="fieldline"><span class="sym">◴</span><div><b>Опыт</b>${p.exp} лет</div></div><div class="fieldline"><span class="sym">☻</span><div><b>Уровень учеников</b>${esc(p.students)}</div></div></div><div class="fact">☀ &nbsp; <strong>Забавный факт</strong><br>${esc(p.fact)}</div><button class="primary card-cta" data-detail="person:${p.id}">▦ &nbsp; Профиль, отзывы и запись &nbsp; ❯</button></div></article>`}

function spotCard(p){let fav=favorites.includes('spot:'+p.id);return `<article class="spot-card"><div class="spot-pic"><img src="${img(p.img)}" alt="${p.name}"><span class="photo-badge">⌖ ${p.region}</span><button class="like-btn ${fav?'active':''}" data-like="spot:${p.id}" aria-label="В избранное">${fav?'♥':'♡'}</button><button type="button" class="gv-spot-edit-trigger" data-action="gvSpotEdit:${p.id}" title="Предложить исправление данных спота" aria-label="Предложить исправление данных спота ${esc(p.name)}"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L9 17l-4 1 1-4L16.5 3.5Z"/></svg></button></div><div class="spot-body"><div class="spot-title"><h3>${p.name}</h3><span class="stars">★ ${p.rating} <small>(${p.reviews})</small></span></div><div class="conditions"><span class="tag soft">${p.type}</span><span class="tag soft">${p.level}</span><span class="tag soft">${p.season}</span></div><p class="spot-summary">${p.summary}</p><div class="chips" style="margin-bottom:14px">${p.nature.map(x=>`<span class="chip info" title="Подробнее — в карточке спота">${x}</span>`).join('')}</div><button class="primary card-cta" data-detail="spot:${p.id}">Подробнее о споте &nbsp; →</button></div></article>`}
function spots(){let data=SPOTS.filter(x=>spotFilter==='Все регионы'||x.region===spotFilter);return hero('people','Карта сёрф-спотов','Открывайте новые места, изучайте особенности берега и выбирайте, где ловить свою волну.','',null)+`<div class="wrap"><section class="section"><div class="pagehead"><h2>Где сегодня искать свою волну?</h2><p>Спутниковая карта Яндекса, координаты, ветер, сезон, инфраструктура и доступ к берегу.</p></div><div class="gg-filters"><select id="spotFilter">${REGIONS.map(x=>`<option ${spotFilter===x?'selected':''}>${x}</option>`).join('')}</select><button class="pill-btn" data-action="spotsMap">⌖ Развернуть карту</button><button class="pill-btn gv-spot-my-suggestions" data-action="gvSpotMySuggestions">✎ Мои предложения <span class="gv-spot-queue-count">${load('gv_spot_suggestions_v1',[]).length||''}</span></button><span class="note">Данные и оценки в прототипе иллюстративные</span></div><div class="spots-overview-map">${mapMarkup('spots',data)}<aside class="spots-map-sidebar"><h3>Точки на карте</h3>${data.map(p=>`<button class="map-spot-row" data-detail="spot:${p.id}"><span>${ICONS.pin}</span><span><b>${p.name}</b><small>${p.region} · ${p.lat}, ${p.lng}</small></span><span>→</span></button>`).join('')}<div class="notice">Для полной общей карты в Конструкторе понадобится создать и опубликовать вашу собственную коллекцию объектов.</div></aside></div><h2 class="section-title" style="margin-top:28px">Карточки спотов</h2><div class="grid grid-3">${data.map(spotCard).join('')}</div></section>${wideBanner()}</div>`}

function mapMarkup(mode,pts){const seed=mode==='spots'?SPOTS:PEOPLE;const coords={"Камчатский край":[53.05,158.82],"Крым":[44.95,34.1],"Сахалин":[46.96,142.75],"Ладожское озеро":[61.4,30.8],"Приморский край":[43.12,131.9]};let center=mode==='spots'?[60.4,98.2]:[58.7,104.1],zoom=3;let subset=pts.filter(x=>x.region===pts[0]?.region);if(pts.length && pts.every(x=>x.region===pts[0].region)){center=coords[pts[0].region]||center;zoom=6}const markers=pts.map((p,i)=>{let lat=p.lat?+p.lat:(coords[p.region]||center)[0],lng=p.lng?+p.lng:(coords[p.region]||center)[1];return `${lng},${lat},pm2rdm${(i%9)+1}`}).join('~');const url=`https://yandex.ru/map-widget/v1/?ll=${center[1]}%2C${center[0]}&z=${zoom}&l=sat${markers?'&pt='+encodeURIComponent(markers):''}`;return `<div class="mapbox yandex-mapbox"><iframe class="ya-frame" src="${url}" loading="lazy" title="Спутниковая карта Яндекс.Карт — ${mode==='gg'?'участники':'споты'}" allowfullscreen></iframe><div class="yandex-ribbon">Яндекс Карты · спутник <small>${mode==='gg'?'Показаны приблизительные региональные точки':'Маркеры спотов из демонстрационного списка'}</small></div><a class="map-open" href="https://yandex.ru/maps/?ll=${center[1]}%2C${center[0]}&z=${zoom}&l=sat" target="_blank" rel="noopener noreferrer">Открыть карту ↗</a></div>`}
function ownMember(){if(!user||!user.gg||!user.public)return null;const points={'Камчатский край':[80,48],'Крым':[27,66],'Сахалин':[75,69],'Ладожское озеро':[21,36],'Приморский край':[79,79]};const pt=points[user.region]||[53,50];return {id:'me',name:user.name,region:user.region,town:user.region,status:'Ищу компанию',exp:0,img:'p0',gg:true,mx:pt[0],my:pt[1]}}

function ggPage(){let data=PEOPLE.filter(p=>p.gg&&(ggFilter.region==='Все регионы'||p.region===ggFilter.region)&&(ggFilter.status==='Все статусы'||p.status===ggFilter.status)&&(!ggFilter.q||`${p.name} ${p.region} ${p.town}`.toLowerCase().includes(ggFilter.q.toLowerCase())));const mine=ownMember();if(mine&&(ggFilter.region==='Все регионы'||mine.region===ggFilter.region)&&(ggFilter.status==='Все статусы'||mine.status===ggFilter.status)&&(!ggFilter.q||`${mine.name} ${mine.region}`.toLowerCase().includes(ggFilter.q.toLowerCase())))data.unshift(mine);const focus=data.find(p=>p.id===ggSelected)||data[0];return hero('home','GG Surfer — свои<br> на каждом берегу','Кто подскажет дорогу к споту? С кем поехать на рассвете? Где найти компанию в незнакомом регионе? Здесь встречаются свои.','Стать GG Surfer','profile')+`<div class="wrap"><section class="section"><div class="gg-heading"><div><div class="eyebrow">Добро пожаловать в сообщество</div><h2>Люди рядом с волной</h2><p>Ищите участников по регионам, изучайте анкеты, находите компанию и начинайте личное общение.</p></div><div class="mini-stat"><span style="font-size:25px">♡</span><div><strong>${PEOPLE.filter(p=>p.gg).length+(mine?1:0)}</strong><span>анкет на карте · демо</span></div></div></div><div class="gg-filters"><input id="ggSearch" value="${esc(ggFilter.q)}" placeholder="Поиск по имени или месту"><select id="ggRegion">${REGIONS.map(x=>`<option ${ggFilter.region===x?'selected':''}>${x}</option>`).join('')}</select><select id="ggStatus">${['Все статусы','Покажу споты','Ищу компанию','Могу подвезти'].map(x=>`<option ${ggFilter.status===x?'selected':''}>${x}</option>`).join('')}</select><button class="pill-btn" data-action="resetGG">Сбросить</button><button class="pill-btn" data-action="inbox">✉ Мои чаты</button></div><div class="gg-widget">${mapMarkup('gg',data)}<aside class="member-list"><h3>Люди на карте <span class="small muted">· ${data.length}</span></h3>${data.length?data.map(p=>`<div class="gg-member-item">${membe const today=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
const toLocalDate=s=>new Date(Number(s.slice(0,4)),Number(s.slice(5,7))-1,Number(s.slice(8,10)));
const localISO=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
const fmtDay=(date)=>{const d=toLocalDate(date);return d.toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'})};

function dayRules(p,date){
  if(!p || !date)return {closed:true,slots:[]};
  const day=toLocalDate(date).getDay();
  const fallback={closed:[1,4].includes(day),slots:[...STANDARD_SLOTS]};
  const saved=availability[p.id]?.[date];
  return saved?{closed:!!saved.closed,slots:Array.isArray(saved.slots)?saved.slots:[...STANDARD_SLOTS]}:fallback;
}
function slotBusy(id,date,slot,exceptId=''){
  return orders.some(o=>o.personId===id&&o.date===date&&(o.slot||'12:00')===slot&&o.status==='accepted'&&o.id!==exceptId);
}
function eligibleSlots(p,date){const rules=dayRules(p,date);return rules.closed||!inRange(date)?[]:rules.slots.filter(s=>!slotBusy(p.id,date,s))}
function countBookings(p,date){return orders.filter(o=>o.personId===p.id&&o.date===date&&o.status==='accepted').length}
function ensureCalendarSelection(p,mode){const c=mode==='manage'?staffCal:publicCal;if(c.date && !inRange(c.date)){c.date='';c.slot=''}if(!c.date){const start=new Date();for(let i=1;i<=35;i++){const d=new Date(start);d.setDate(start.getDate()+i);const ds=localISO(d);if(eligibleSlots(p,ds).length){c.date=ds;break}}}if(!c.date)c.date=today();return c}
function makeCalendar(p,mode='public'){
 const manage=mode==='manage',c=ensureCalendarSelection(p,mode),now=new Date();
 const month=new Date(now.getFullYear(),now.getMonth()+c.shift,1),year=month.getFullYear(),mo=month.getMonth(),length=new Date(year,mo+1,0).getDate(),first=(month.getDay()+6)%7;
 const dayButtons=Array.from({length:first},()=>`<span class="lesson-day empty"></span>`);
 for(let i=1;i<=length;i++){
  const date=`${year}-${String(mo+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`;
  const rules=dayRules(p,date),slots=eligibleSlots(p,date),expired=!inRange(date),busy=countBookings(p,date);
  const cls=expired?'':rules.closed?'closed':!slots.length?'booked':'';
  const text=expired?'':rules.closed?'выходной':busy?`${busy} занято`:slots.length?`${slots.length} окна`:'занято';
  dayButtons.push(`<button class="lesson-day ${cls} ${c.date===date?'selected':''} ${date===today()?'today':''}" data-lesson-day="${mode}|${p.id}|${date}" ${expired?'disabled':''} aria-label="${fmtDay(date)}: ${text||'недоступно'}"><strong>${i}</strong><span>${text}</span></button>`);
 }
 const curr=dayRules(p,c.date),slotData=STANDARD_SLOTS.map(slot=>({slot,active:curr.slots.includes(slot),busy:slotBusy(p.id,c.date,slot)}));
 const controls=manage?
 `<span class="lesson-kicker">Управление доступностью</span><h3>${fmtDay(c.date)}</h3><p>Нажмите на время, чтобы открыть или закрыть запись. Подтверждённые занятия нельзя убрать из календаря.</p><div class="lesson-slot-grid">${slotData.map(({slot,active,busy})=>`<button class="lesson-slot manage ${!active?'selected':''}" data-lesson-slot-manage="${p.id}|${c.date}|${slot}" ${busy?'disabled':''}>${slot}${busy?' · занято':!active?' · закрыто':''}</button>`).join('')}</div><button class="pill-btn" data-lesson-toggle-date="${p.id}|${c.date}">${curr.closed?'Открыть этот день':'Сделать день выходным'}</button><p class="lesson-hint" style="margin-top:12px">Изменения сохраняются в этом браузере. В настоящем сервисе потребуется сервер и синхронизация расписания.</p>`:
 `<span class="lesson-kicker">Выберите время</span><h3>${fmtDay(c.date)}</h3>${curr.closed?'<p>В этот день инструктор не принимает заявки. Попробуйте соседнюю дату.</p>':`<p>Время указано ориентировочно, по местному времени инструктора.</p><div class="lesson-slot-grid">${slotData.filter(x=>x.active).map(({slot,busy})=>`<button class="lesson-slot ${c.slot===slot?'selected':''}" data-lesson-slot="${p.id}|${slot}" ${busy?'disabled':''}>${slot}${busy?' · занято':''}</button>`).join('')||'<span class="lesson-hint">Все окна заняты.</span>'}</div>`}<div class="lesson-price">Стоимость — по договорённости с инструктором</div><button class="primary lesson-cal-cta" data-lesson-book="${p.id}" ${!c.slot||!eligibleSlots(p,c.date).includes(c.slot)?'disabled':''}>Продолжить запись →</button><p class="lesson-micro" style="margin-top:10px">Оплата на этом этапе не списывается.</p>`;
 return `<div class="lesson-cal-wrap"><div class="lesson-cal"><div class="lesson-cal-header"><strong>${MONTHS[mo]} ${year}</strong><div class="lesson-cal-nav"><button data-lesson-month="${mode}|-1|${p.id}" ${c.shift<=0?'disabled':''} aria-label="Предыдущий месяц">‹</button><button data-lesson-month="${mode}|1|${p.id}" ${c.shift>=2?'disabled':''} aria-label="Следующий месяц">›</button></div></div><div class="lesson-cal-grid">${WD.map(x=>`<span class="lesson-weekday">${x}</span>`).join('')}${dayButtons.join('')}</div><div class="lesson-cal-legend"><span><i class="lesson-dot"></i>Есть окна</span><span><i class="lesson-dot muted"></i>Выходной</span><span><i class="lesson-dot busy"></i>Занято</span></div></div><div class="lesson-side">${controls}</div></div>`;
}
function ratingsPanel(p){const local=userReviews.filter(r=>r.personId===p.id);const n=(Number(p.reviews)||0)+local.length;const base=Number(p.rating)||0;const avg=n?((base*(Number(p.reviews)||0)+local.reduce((s,r)=>s+(Number(r.rating)||0),0))/n).toFixed(1):'—';return `<div class="lesson-reviews-section"><div class="lesson-review-metric"><span class="lesson-kicker">Оценка учеников</span><strong>${avg}</strong><span class="lesson-review-stars">★★★★★</span><p>${n} отзывов · показаны примеры и локальные отзывы</p></div><div class="lesson-review-list">${reviewCards(p)||'<div class="lesson-empty"><div class="lesson-waves">≋</div><strong>Первые слова ещё впереди</strong><p>Отзывы появятся после завершения подтверждённых занятий.</p></div>'}</div></div>`}

}

 if(!p||!c.date||!c.slot||!eligibleSlots(p,c.date).includes(c.slot)){toast('Это время уже недоступно — выберите другое');window.showPerson(pId,'calendar');return}

function orderCard(o,mode='client'){
 const p=pById(o.personId),isCoach=mode==='coach';

  actions.push(`<button class="primary" data-lesson-accept="${o.id}">✓ Принять заявку</button><button class="lesson-outline-danger" data-lesson-decline="${o.id}">Отклонить</button>`)

}

function editDay(pId,date,closed,slot){const p=pById(pId);if(!p||!isStaffAccess(pId))return;const booked=orders.filter(o=>o.personId===pId&&o.date===date&&o.status==='accepted');if(closed===true&&booked.length){toast('Здесь уже есть подтверждённые занятия');return}
 const r=dayRules(p,date);if(slot){if(booked.some(o=>(o.slot||'12:00')===slot)){toast('Это время уже подтверждено ученику');return}r.slots=r.slots.includes(slot)?r.slots.filter(s=>s!==slot):[...r.slots,slot].sort();if(r.slots.length)r.closed=false}
 else r.closed=closed;

function decline(id){const o=orders.find(x=>x.id===id);if(!o||o.status!=='pending'||!isStaffAccess(o.personId))return;o.status='declined';saveOrders();toast('Заявка отклонена (демо)');window.render()}
function complete(id){const o=orders.find(x=>x.id===id);if(!o||o.status!=='accepted'||!isStaffAccess(o.personId))return;o.status='completed';o.completedAt=new Date().toISOString();saveOrders();toast('Занятие завершено. Теперь ученик может оставить отзыв.');window.render()}
function cancelOrder(id){const o=orders.find(x=>x.id===id);if(!o||!['pending','accepted'].includes(o.status))return;o.status='cancelled';saveOrders();toast('Заявка отменена. Для нового времени создайте новую заявку.');readOrders()}
function makeDemo(id){if(!isStaffAccess(id))return;const p=pById(id);if(!p)return;const start=new Date();let date='',slot='';for(let i=1;i<38;i++){const d=new Date(start);d.setDate(start.getDate()+i);const iso=localISO(d),slots=eligibleSlots(p,iso);if(slots.length){date=iso;slot=slots[0];break}}if(!date){toast('Сначала откройте свободную дату в календаре');return}orders.unshift({id:'demo_'+Date.now(),personId:id,clientName:'Саша — тестовый ученик',clientKey:'demo_student',date,slot,service:'Индивидуальное',level:'Первое занятие',note:'Буду в вашем регионе. Это тестовая заявка для проверки работы кабинета.',status:'pending',demo:true,createdAt:new Date().toISOString()});saveOrders();accountTab='requests';toast('Тестовая заявка создана. Можно подтвердить её.');window.render()}
window.acceptOrder=accept;window.completeOrder=complete;
window.reviewOrder=function(id){const o=orders.find(x=>x.id===id);if(!o||o.status!=='completed'||userReviews.some(r=>r.orderId===id)){toast('Оценить можно только завершённое занятие — один раз');return}
 const p=pById(o.personId);openModal(`<span class="lesson-kicker">После занятия · отзыв ученика</span><h2>Как прошла ваша встреча?</h2><p>${esc(p?.name||'Инструктор')} · ${fmtDay(o.date)}. Ваш отзыв поможет другим сёрферам выбрать инструктора.</p><div class="lesson-form-note">В прототипе отзыв будет виден только в этом браузере. В настоящей версии ссылка на отзыв появится после подтверждённого завершения урока.</div><label class="field">Оценка *<select id="lessonStars"><option value="5">★★★★★ Отлично!</option><option value="4">★★★★☆ Хорошо</option><option value="3">★★★☆☆ Нормально</option><option value="2">★★☆☆☆ Не очень</option><option value="1">★☆☆☆☆ Не понравилось</option></select></label><label class="field">Ваши впечатления *<textarea id="lessonReviewText" placeholder="Как проходил урок? Что понравилось, что можно улучшить?" required maxlength="1000" rows="5"></textarea></label><div class="lesson-footer-actions"><button class="pill-btn" data-action="orders">Вернуться к заявкам</button><button class="primary" data-action="saveLessonReview:${id}">Опубликовать отзыв →</button></div>`,true)};
window.openChat=function(id, perspective='student'){
 if(!user){openRegister();return}const c=chats.find(x=>x.id===id);if(!c)return;const o=orders.find(x=>x.id===c.orderId);if(c.type==='lesson' && (!o||!['accepted','completed'].includes(o.status))){toast('Чат появится после подтверждения занятия');return}

 const p=pById(c.target),name=c.type==='lesson'?(perspective==='coach'?(o?.clientName||'Ученик'):(p?.name||'Инструктор')):(p?.name||'Участник');

function actionClick(e){
 const el=e.target.closest('[data-lesson-tab],[data-lesson-month],[data-lesson-day],[data-lesson-slot],[data-lesson-slot-manage],[data-lesson-toggle-date],[data-lesson-book],[data-lesson-submit],[data-lesson-worktab],[data-lesson-accept],[data-lesson-decline],[data-lesson-complete],[data-lesson-cancel],[data-lesson-review],[data-lesson-previewcoach],[data-lesson-endpreview],[data-lesson-create-demo],[data-lesson-openchat],[data-lesson-chatid]');if(!el)return;

 if((v=el.dataset.lessonDay)){const [mode,id,date]=v.split('|'),c=mode==='manage'?staffCal:publicCal;c.date=date;c.slot='';if(mode==='manage')window.render();else window.showPerson(id,'calendar');return}
 if((v=el.dataset.lessonSlot)){const [id,slot]=v.split('|');publicCal.slot=slot;window.showPerson(id,'calendar');return}
 if((v=el.dataset.lessonSlotManage)){const [id,date,slot]=v.split('|');editDay(id,date,undefined,slot);return}

 if((v=el.dataset.lessonBook)){selectedId=v;window.showBook();return}

 if((v=el.dataset.lessonComplete)){complete(v);return}
 if((v=el.dataset.lessonCancel)){cancelOrder(v);return}
 if((v=el.dataset.lessonReview)){window.reviewOrder(v);return}
 if((v=el.dataset.lessonCreateDemo)){makeDemo(v);return}
 if((v=el.dataset.lessonOpenchat)){const [id,perspective]=v.split('|'),o=orders.find(x=>x.id===id);if(o)window.openChat(putChat(o.personId,'lesson',id).id,perspective);return}
 if((v=el.dataset.lessonChatid)){window.openChat(v);return}
}
