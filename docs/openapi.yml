      - thickness_display
      - thickness_in
      - updated_at
      - version
      - volume_display
      - volume_l
      - width_display
      - width_in
    VariantWriteRequest:
      type: object
      description: Вход варианта. Размеры — числом в дюймах (*_in) или строкой («5'10"»,
        «20 1/2», «52 см»).
      properties:
        length_in:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
        length:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 40
        width_in:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
        width:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 40
        thickness_in:
          type: string
          format: decimal
          pattern: ^-?\d{0,2}(?:\.\d{0,2})?$
          nullable: true
        thickness:
          type: string
          writeOnly: true
          maxLength: 40
        volume_l:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          nullable: true
        material_id:
          type: integer
          nullable: true
        construction:
          type: string
          maxLength: 80
        fin_system:
          $ref: '#/components/schemas/FinSystemEnum'
        fin_setup:
          type: string
          maxLength: 40
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          nullable: true
        currency:
          type: string
          minLength: 1
          pattern: ^[A-Z]{3}$
        made_to_order_days:
          type: integer
          maximum: 365
          minimum: 0
          nullable: true
        sku_suffix:
          type: string
          maxLength: 12
        is_active:
          type: boolean
        in_stock_quantity:
          type: integer
          maximum: 100
          minimum: 0
          writeOnly: true
          description: Число свободных экземпляров мастерской на продажу
    VerificationStatusEnum:
      enum:
      - none
      - pending
      - verified
      - rejected
      type: string
      description: |-
        * `none` - Не подтверждена
        * `pending` - На проверке
        * `verified` - Подтверждена
        * `rejected` - Отклонена
    VolumeRange:
      type: object
      properties:
        min:
          type: string
          format: decimal
          pattern: ^-?\d{0,5}(?:\.\d{0,1})?$
        max:
          type: string
          format: decimal
          pattern: ^-?\d{0,5}(?:\.\d{0,1})?$
      required:
      - max
      - min
