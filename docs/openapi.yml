openapi: 3.0.3
info:
  title: ГДеволна API
  version: 1.0.0
  description: Единый API платформы ГДеволна 2.0 (/api/v1/).
paths:
  /api/v1/analytics/views:
    post:
      operationId: analytics_views_create
      description: |-
        Квалифицированный просмотр публичной карточки. Боты, самопросмотры, сотрудники владельца и повторы зрителя
        за сутки не учитываются; анонимному зрителю выдаётся cookie gv_aid.
      tags:
      - analytics
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalyticsViewInputRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AnalyticsViewInputRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsViewResult'
          description: ''
  /api/v1/assistant/board-size:
    post:
      operationId: assistant_board_size_create
      summary: Подбор объёма доски по гильд-фактору (AIX-03)
      tags:
      - assistant
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BoardSizeInputRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BoardSizeInputRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardSizeResponse'
          description: ''
  /api/v1/assistant/recommend:
    post:
      operationId: assistant_recommend_create
      summary: Споты, инструкторы и прокат под уровень (AIX-01/02, только данные каталога)
      tags:
      - assistant
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecommendInputRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RecommendInputRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendResponse'
          description: ''
  /api/v1/auth/2fa/verify:
    post:
      operationId: auth_2fa_verify_create
      summary: Подтвердить сессию TOTP-кодом
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TwoFactorCodeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TwoFactorCodeRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TwoFactorState'
          description: ''
  /api/v1/auth/csrf:
    get:
      operationId: auth_csrf_retrieve
      summary: Выдать cookie csrftoken
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Csrf'
          description: ''
  /api/v1/auth/login:
    post:
      operationId: auth_login_create
      summary: Вход
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/v1/auth/logout:
    post:
      operationId: auth_logout_create
      summary: Выход
      tags:
      - auth
      security:
      - cookieAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/auth/password-change:
    post:
      operationId: auth_password_change_create
      summary: Сменить пароль
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountsDetail'
          description: ''
  /api/v1/auth/password-reset:
    post:
      operationId: auth_password_reset_create
      summary: Запросить ссылку для сброса пароля (ACC-13)
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountsDetail'
          description: ''
  /api/v1/auth/password-reset/confirm:
    post:
      operationId: auth_password_reset_confirm_create
      summary: Задать новый пароль по ссылке
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountsDetail'
          description: ''
  /api/v1/auth/register:
    post:
      operationId: auth_register_create
      summary: Регистрация (ATX-01)
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
          description: ''
  /api/v1/auth/verify-email:
    post:
      operationId: auth_verify_email_create
      summary: Подтвердить email по ссылке из письма
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailTokenRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmailTokenRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailVerified'
          description: ''
  /api/v1/auth/verify-email/resend:
    post:
      operationId: auth_verify_email_resend_create
      summary: Отправить письмо подтверждения повторно
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountsDetail'
          description: ''
  /api/v1/blocks:
    post:
      operationId: blocks_create
      summary: Заблокировать собеседника
      tags:
      - blocks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountBlockCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AccountBlockCreateRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountBlock'
          description: ''
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountBlock'
          description: Уже заблокирован
  /api/v1/blocks/{account_id}:
    delete:
      operationId: blocks_destroy
      summary: Снять блокировку
      parameters:
      - in: path
        name: account_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - blocks
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/board-materials:
    get:
      operationId: board_materials_list
      summary: Материалы для фильтра каталога
      tags:
      - boards
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Material'
          description: ''
  /api/v1/board-types:
    get:
      operationId: board_types_list
      summary: Типы досок для фильтра каталога (стандартные + используемые мастерскими)
      tags:
      - boards
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BoardType'
          description: ''
  /api/v1/boards:
    get:
      operationId: boards_list
      summary: '«Все доски»: каталог опубликованных моделей'
      parameters:
      - in: query
        name: availability
        schema:
          type: string
        description: in_stock | made_to_order | out_of_stock (через запятую)
      - in: query
        name: length_max
        schema:
          type: string
        description: 'Длина до: дюймы или 6''2"'
      - in: query
        name: length_min
        schema:
          type: string
        description: 'Длина от: дюймы (70) или 5''10"'
      - in: query
        name: material
        schema:
          type: string
        description: id или название материала
      - in: query
        name: ordering
        schema:
          type: string
          enum:
          - -price
          - name
          - new
          - price
        description: По умолчанию new
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: price_max
        schema:
          type: number
          format: double
        description: Цена варианта до
      - in: query
        name: q
        schema:
          type: string
        description: Модель, мастерская, тип, регион, артикул
      - in: query
        name: region
        schema:
          type: string
        description: slug или id региона мастерской
      - in: query
        name: repair
        schema:
          type: boolean
        description: Мастерская делает ремонт (SHP-04)
      - in: query
        name: shaper
        schema:
          type: string
        description: slug мастерской
      - in: query
        name: type
        schema:
          type: string
        description: 'Код типа доски (можно несколько через запятую): fish, gun…'
      - in: query
        name: volume_max
        schema:
          type: number
          format: double
        description: Объём до, л
      - in: query
        name: volume_min
        schema:
          type: number
          format: double
        description: Объём от, л
      tags:
      - boards
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBoardCardList'
          description: ''
  /api/v1/boards/{id}:
    get:
      operationId: boards_retrieve
      summary: 'Модель доски: варианты, фото, видео, мастерская, is_own'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - boards
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardDetail'
          description: ''
  /api/v1/bookings:
    get:
      operationId: bookings_list
      summary: Мои брони (box=mine) или брони исполнителя (box=provider)
      parameters:
      - in: query
        name: box
        schema:
          type: string
          enum:
          - mine
          - provider
      - in: query
        name: from
        schema:
          type: string
          format: date-time
        description: starts_at ≥ from (дата или ISO)
      - in: query
        name: kind
        schema:
          type: string
          enum:
          - lesson
          - rental
      - in: query
        name: organization
        schema:
          type: string
          format: uuid
      - in: query
        name: page
        schema:
          type: integer
      - in: query
        name: page_size
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: string
        description: Один или несколько через запятую
      - in: query
        name: to
        schema:
          type: string
          format: date-time
        description: starts_at < to
      tags:
      - bookings
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBookingList'
          description: ''
    post:
      operationId: bookings_create
      summary: 'Создать бронь: занятие или аренда (status=requested)'
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: Повтор запроса с тем же ключом не создаёт дубль (9.1)
      tags:
      - bookings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BookingCreateRequest'
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingDetail'
          description: ''
  /api/v1/bookings/{id}:
    get:
      operationId: bookings_retrieve
      summary: 'Бронь: карточка, история, связанные брони'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - bookings
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingDetail'
          description: ''
  /api/v1/bookings/{id}/cancel:
    post:
      operationId: bookings_cancel_create
      summary: 'Отменить: клиент (до начала) или исполнитель (причина обязательна)'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - bookings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommerceReasonRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CommerceReasonRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingDetail'
          description: ''
  /api/v1/bookings/{id}/complete:
    post:
      operationId: bookings_complete_create
      summary: 'Отменить: клиент (до начала) или исполнитель (причина обязательна)'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - bookings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommerceReasonRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CommerceReasonRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingDetail'
          description: ''
  /api/v1/bookings/{id}/confirm:
    post:
      operationId: bookings_confirm_create
      summary: 'Отменить: клиент (до начала) или исполнитель (причина обязательна)'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - bookings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommerceReasonRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CommerceReasonRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingDetail'
          description: ''
  /api/v1/bookings/{id}/decline:
    post:
      operationId: bookings_decline_create
      summary: 'Отменить: клиент (до начала) или исполнитель (причина обязательна)'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - bookings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommerceReasonRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CommerceReasonRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingDetail'
          description: ''
  /api/v1/bookings/{id}/handover:
    post:
      operationId: bookings_handover_create
      summary: Акт выдачи (confirmed → in_progress) или возврата (in_progress → completed)
        — RENT-06
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - rentals
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HandoverWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/HandoverWriteRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Handover'
          description: ''
  /api/v1/bookings/{id}/handovers:
    get:
      operationId: bookings_handovers_list
      summary: Акты по брони — клиенту и исполнителю
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - rentals
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Handover'
          description: ''
  /api/v1/bookings/{id}/no-show:
    post:
      operationId: bookings_no_show_create
      summary: 'Отменить: клиент (до начала) или исполнитель (причина обязательна)'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - bookings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommerceReasonRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CommerceReasonRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingDetail'
          description: ''
  /api/v1/bookings/{id}/start:
    post:
      operationId: bookings_start_create
      summary: 'Отменить: клиент (до начала) или исполнитель (причина обязательна)'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - bookings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommerceReasonRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CommerceReasonRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingDetail'
          description: ''
  /api/v1/certificates/{id}/scan:
    get:
      operationId: certificates_scan_retrieve
      description: 'Presigned GET на скан (INS-04, ATX-23): публично — только проверенный
        и разрешённый к показу.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - instructors
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateScanUrl'
          description: ''
        '404':
          description: Нет доступа
  /api/v1/club:
    get:
      operationId: club_retrieve
      summary: 'Страница клуба: о проекте, статистика, анонсы, события'
      tags:
      - club
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClubOverview'
          description: ''
  /api/v1/club/events:
    get:
      operationId: club_events_list
      summary: Календарь клубных событий (без окна — предстоящие)
      parameters:
      - in: query
        name: from
        schema:
          type: string
          format: date
        description: Начало окна календаря (дата или ISO 8601)
      - in: query
        name: kind
        schema:
          type: string
          enum:
          - contest
          - meetup
          - ride
          - trip
          - workshop
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: region
        schema:
          type: string
        description: slug или id региона
      - in: query
        name: spot
        schema:
          type: string
        description: slug или id спота
      - in: query
        name: to
        schema:
          type: string
          format: date
        description: Конец окна (включительно для даты)
      tags:
      - club
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedClubEventCardList'
          description: ''
  /api/v1/club/events/{id}/registration:
    post:
      operationId: club_events_registration_create
      summary: Зарегистрироваться (registered или waitlist; идемпотентно)
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - club
      security:
      - cookieAuth: []
      responses:
