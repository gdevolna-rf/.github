worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  server_tokens off;

  log_format main '$remote_addr "$request" $status $body_bytes_sent $request_time rid=$request_id';
  access_log /dev/stdout main;
  error_log  /dev/stderr warn;

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  # Резолвер Docker, чтобы nginx переживал перезапуск контейнеров.
  resolver 127.0.0.11 valid=10s ipv6=off;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;

  server {
    listen 80;
    client_max_body_size 20m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    set $backend  http://backend:8000;
    set $frontend http://frontend:3000;
    set $minio    http://minio:9000;

    location /api/ {
      proxy_pass $backend;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $request_id;
    }

    location /admin/ {
      proxy_pass $backend;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $request_id;
    }

    location /ws/ {
      proxy_pass $backend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 3600s;
    }

    location /django-static/ {
      alias /srv/django-static/;
      expires 7d;
    }

    # Объектное хранилище: публичные медиа и загрузки по presigned-ссылкам.
    # Host передаётся как есть — подпись S3 v4 включает заголовок Host.
    location /gdevolna-media/ {
      client_max_body_size 600m;
      proxy_request_buffering off;
      proxy_pass $minio;
      proxy_set_header Host $http_host;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      expires 1h;
    }

    location / {
      proxy_pass $frontend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
